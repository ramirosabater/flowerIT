<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Automotora · Demo · FloWer</title><meta name="description" content="Demo con datos ficticios de un catálogo online para una agencia de autos, con consulta por WhatsApp y panel de administración."><meta name="robots" content="noindex"><meta name="theme-color" content="#062B4D"><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22380%22%20height%3D%22228%22%20viewBox%3D%220%200%20380%20228%22%3E%3Crect%20x%3D%226%22%20y%3D%226%22%20width%3D%22368%22%20height%3D%22216%22%20rx%3D%2240%22%20fill%3D%22%23053661%22%20stroke%3D%22%23C9D2DC%22%20stroke-width%3D%2210%22%2F%3E%3Cpath%20d%3D%22M150%2C34%20L230%2C34%20L268%2C112%20L112%2C112%20Z%22%20fill%3D%22%230B3A66%22%20stroke%3D%22%23C9D2DC%22%20stroke-width%3D%224%22%2F%3E%3Cpath%20d%3D%22M186%2C44%20L194%2C44%20L196%2C62%20L184%2C62%20Z%20M183%2C74%20L197%2C74%20L200%2C100%20L180%2C100%20Z%22%20fill%3D%22%23F5B301%22%2F%3E%3Ctext%20x%3D%22190%22%20y%3D%22166%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%20Black%2CArial%2CHelvetica%2Csans-serif%22%20font-weight%3D%22900%22%20font-size%3D%2254%22%20fill%3D%22%23fff%22%20letter-spacing%3D%222%22%3ERUTA%20SUR%3C%2Ftext%3E%3Ctext%20x%3D%22190%22%20y%3D%22200%22%20text-anchor%3D%22middle%22%20font-family%3D%22Arial%2CHelvetica%2Csans-serif%22%20font-weight%3D%22700%22%20font-size%3D%2224%22%20fill%3D%22%23C9D2DC%22%20letter-spacing%3D%227%22%3EAUTOMOTORES%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&display=swap">
<style id="app-style">
:root{
  --navy:#062B4D; --navy-2:#0B3A66; --navy-deep:#041D35; --shield:#053661;
  --ink:#0B1A2B; --muted:#586A7E; --paper:#EDF1F5; --card:#FFFFFF; --line:#D5DDE6;
  --go:#22C55E; --sky:#1E9BE0; --hot:#E23B2E; --sun:#F5B301;
  --silver:#C9D2DC;
  --chrome:linear-gradient(180deg,#FFFFFF 0%,#D9E0E7 40%,#8E9BAA 52%,#E4E9EE 100%);
  --font:"Archivo","Arial",Helvetica,sans-serif;
  --r:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--font);font-stretch:100%;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
@media (max-width:480px){.wrap{padding-inline:16px}}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--font);font-stretch:125%;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;line-height:1}
.price{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.1;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-wa{background:#1FB855;color:#fff}
.btn-wa:hover{background:#18A34A}
.btn-navy{background:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-2)}
.btn-chrome{background:var(--chrome);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(255,255,255,.6),0 1px 0 rgba(0,0,0,.25)}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2px currentColor}
.btn-sm{padding:9px 13px;font-size:14px}
.btn-icon{padding:8px;width:40px;height:40px}
.btn-icon svg{width:22px;height:22px}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);border-bottom:2px solid var(--silver)}
.top .wrap{display:flex;align-items:center;gap:16px;min-height:72px}
.logo{display:block;flex:none;line-height:0}
.logo img{height:52px;width:auto}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{font-weight:600;text-decoration:none;padding:8px 12px;border-radius:8px;font-size:15px;color:#DCE5EE}
.nav a:hover{background:var(--navy-2);color:#fff}
@media (max-width:860px){.nav{display:none}.top .btn-wa{margin-left:auto}}
@media (max-width:480px){.logo img{height:44px}.top .btn-wa span{display:none}.top .btn-wa{padding:9px}}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(165deg,var(--navy-2) 0%,var(--navy) 55%,var(--navy-deep) 100%)}
.hero::before{content:"";position:absolute;left:-10%;right:-10%;bottom:-2px;height:38%;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.05) 100%);transform:skewY(-4deg);transform-origin:left}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-block:56px 64px}
.hero h1{font-size:clamp(36px,5.4vw,68px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:.98;letter-spacing:-.015em;margin:0 0 18px}
.hero .lead{font-size:19px;color:#C6D3E1;max-width:40ch;margin:0 0 28px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.hero .btn-ghost{color:#fff}
.hero .feat{max-width:440px;justify-self:end;width:100%}
@media (max-width:900px){.hero .wrap{grid-template-columns:1fr;gap:36px;padding-block:40px 48px}.hero .feat{justify-self:start}}

/* services strip */
.strip{background:var(--chrome);color:var(--navy);border-block:1px solid #7F8C9B}
.strip .wrap{display:flex;justify-content:center;align-items:center;gap:22px;flex-wrap:wrap;padding-block:14px}
.strip span{font-stretch:125%;font-weight:800;text-transform:uppercase;font-size:clamp(16px,2.4vw,22px);letter-spacing:.02em}
@media (max-width:480px){.strip .wrap{gap:10px}.strip span{font-size:15px;font-stretch:108%}.strip i{width:7px!important;height:7px!important}}
.strip i{width:9px;height:9px;background:var(--navy);transform:rotate(45deg);display:inline-block}

/* sections */
section.block{padding-block:64px}
.sec-head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.sec-head h2{font-size:clamp(32px,4.6vw,52px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1;letter-spacing:-.01em;color:var(--navy)}
.sec-head p{margin:8px 0 0;color:var(--muted);max-width:56ch}
.empty{border:2px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted);background:#fff}

/* offer "story" cards */
.stories{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.story{position:relative;background:#08111C;color:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 40px -22px rgba(4,29,53,.7)}
.story .media{position:relative;aspect-ratio:4/3;background:#0B1A2B}
.story .media img,.story .media .ph{width:100%;height:100%;object-fit:cover}
.story .media::after{pointer-events:none;content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(180deg,rgba(8,17,28,0),#08111C)}
.story .body{padding:6px 20px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;flex:1;position:relative;z-index:1}
.story h3{font-size:clamp(20px,2.2vw,25px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1.02}
.story .ver{margin:2px 0 0;color:#D6DEE7;font-weight:600;font-size:15px}
.story .spec{margin:0;color:#9FB0C2;font-size:15px;font-variant-numeric:tabular-nums}
.story .big{font-stretch:125%;font-weight:900;font-size:clamp(56px,6.4vw,76px);line-height:.95;letter-spacing:-.03em;margin-top:12px}
.story .big.ask{font-size:28px;letter-spacing:0;margin-block:18px 8px;color:#D6DEE7}
.story .old{color:#9FB0C2;font-size:15px;text-decoration:line-through;text-decoration-color:var(--hot);text-decoration-thickness:2px}
.band{--b:var(--go);--bt:#04121F;display:block;width:100%;background:var(--b);color:var(--bt);font-weight:800;font-stretch:112%;text-transform:uppercase;font-size:15px;letter-spacing:.02em;padding:7px 12px;margin-top:10px}
.story .until{font-size:13px;color:#9FB0C2;margin-top:6px}
.story .actions{display:flex;gap:10px;margin-top:auto;padding-top:18px;width:100%}
.story .actions .btn{flex:1}
.tag{position:absolute;left:12px;top:12px;z-index:2;background:#fff;color:var(--navy);font-weight:700;font-size:13px;padding:5px 11px;border-radius:999px}
.sticker{position:absolute;right:12px;top:12px;z-index:2;background:var(--hot);color:#fff;font-weight:900;font-stretch:125%;font-size:20px;padding:10px 8px;border-radius:50%;width:66px;height:66px;display:grid;place-items:center;transform:rotate(8deg)}

/* stock */
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #B9C5D2;border-radius:10px;padding:2px 6px 2px 14px}
.search:focus-within{border-color:var(--navy)}
.search input{border:0;outline:0;background:transparent;padding:10px 4px;flex:1;min-width:0}
.sort{border:1.5px solid #B9C5D2;border-radius:10px;padding:10px 12px;background:#fff}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1.5px solid #B9C5D2;background:#fff;border-radius:999px;padding:7px 14px 7px 10px;font-weight:600;cursor:pointer;font-size:15px}
.chip i{width:12px;height:12px;border-radius:50%;flex:none}
.chip small{color:var(--muted);font-weight:600}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chip[aria-pressed="true"] small{color:#B9C8D8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.car{position:relative;background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.car:hover{border-color:#9FB0C2}
.car .media{position:relative;aspect-ratio:4/3;background:#DDE4EB}
.car .media img,.car .media .ph{width:100%;height:100%;object-fit:cover}
.car.sold .media img{filter:grayscale(.7) brightness(.9)}
.ribbon{position:absolute;left:-25%;right:-25%;top:50%;z-index:2;transform:translateY(-50%) rotate(-14deg);background:var(--hot);color:#fff;text-align:center;font-weight:900;font-stretch:125%;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(22px,3vw,30px);padding:8px 0;border-block:4px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.35);pointer-events:none}
.gal .main .ribbon{font-size:clamp(28px,5vw,48px)}
.flag{position:absolute;left:10px;top:10px;font-weight:700;font-size:13px;padding:4px 10px;border-radius:6px;background:var(--hot);color:#fff}
.flag.star{background:var(--navy);color:#fff}
.flag.res{background:var(--sun);color:var(--ink)}
.flag.sold{background:var(--ink);color:#fff}
.slides{position:absolute;inset:0}
.slides>img,.slides>.ph{width:100%;height:100%;object-fit:cover}
.tapnext{position:absolute;inset:0;z-index:2;border:0;background:transparent;cursor:pointer;padding:0}
.tapnext:focus-visible{outline:none}
.cnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:var(--ink);font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.9}
.cprev{left:8px}.cnext{right:8px}
@media (hover:hover){.cnav{opacity:0;transition:opacity .15s}.media:hover .cnav,.cnav:focus-visible{opacity:1}}
.cctr{position:absolute;right:10px;bottom:10px;z-index:3;background:rgba(4,18,31,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;pointer-events:none}
.dots{position:absolute;left:0;right:0;bottom:12px;z-index:3;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dots i.on{background:#fff}
.story .dots{bottom:34px}.story .cctr{bottom:auto;top:12px;right:12px}
.story .media:has(.sticker) .cctr{display:none}
.count{position:absolute;right:10px;bottom:10px;background:rgba(4,18,31,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.car .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.car .cat{font-size:13px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.car .cat i{width:9px;height:9px;border-radius:50%}
.car h3{font-size:20px;font-weight:800;font-stretch:115%;line-height:1.15}
.open{all:unset;cursor:pointer}
.open::after{content:"";position:absolute;inset:0;z-index:1}
.open:focus-visible{outline:none}
.car:has(.open:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.car .ver{margin:-2px 0 0;color:var(--muted);font-size:15px}
.specs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.specs span{background:var(--paper);border-radius:6px;padding:3px 8px;font-size:13px;font-weight:600;color:#334458;font-variant-numeric:tabular-nums}
.car .fin{margin:0;font-size:13px;font-weight:700;color:#12813D}
.car .foot{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.car .pr{font-stretch:125%;font-weight:900;font-size:28px;letter-spacing:-.02em;color:var(--navy)}
.car .pr.ask{font-stretch:100%;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.car .foot .btn{position:relative;z-index:2}
.more{grid-column:1/-1;text-align:center;padding-top:8px}

/* placeholder art */
.ph{--c:var(--navy-2);display:grid;place-items:center;background:linear-gradient(160deg,var(--c),#0A2744);color:#fff}
.ph svg{width:58%;height:auto;opacity:.85}

/* detail modal */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(4,18,31,.72);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg .panel{position:relative;background:#fff;border-radius:18px;width:min(1040px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;display:grid;grid-template-columns:1.25fr 1fr}
.dlg .x{position:absolute;right:12px;top:12px;z-index:3;width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.gal{background:#0B1A2B;display:flex;flex-direction:column}
.gal .main{position:relative;aspect-ratio:4/3;overflow:hidden}
.gal .main img,.gal .main .ph{width:100%;height:100%;object-fit:cover}
.gal .nav-b{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer;display:grid;place-items:center}
.gal .prev{left:10px}.gal .next{right:10px}
.gal .ctr{position:absolute;left:12px;bottom:12px;background:rgba(4,18,31,.72);color:#fff;font-size:13px;font-weight:600;padding:3px 9px;border-radius:6px}
.thumbs{display:flex;gap:8px;padding:10px;overflow-x:auto}
.thumbs button{flex:none;width:76px;height:57px;border-radius:8px;overflow:hidden;border:2px solid transparent;padding:0;cursor:pointer;background:none;opacity:.7}
.thumbs button[aria-current="true"]{border-color:#fff;opacity:1}
.thumbs img{width:100%;height:100%;object-fit:cover}
.info{padding:26px 24px 24px;display:flex;flex-direction:column;gap:12px}
.info .cat{font-size:14px;font-weight:600;color:var(--muted)}
.info h2{font-size:clamp(26px,3vw,34px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1;color:var(--navy)}
.info .ver{margin:-4px 0 0;color:var(--muted);font-size:17px}
.info .big{font-stretch:125%;font-weight:900;font-size:48px;line-height:1;letter-spacing:-.03em;color:var(--ink)}
.info .full{font-size:14px;color:var(--muted)}
.info .old{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--hot);text-decoration-thickness:2px}
.info .band{border-radius:6px;margin:0;width:auto;align-self:flex-start}
.st-note{font-weight:700;padding:8px 12px;border-radius:8px;background:#FFF4D6;color:#6B4E00}
.st-note.sold{background:#EEF1F4;color:var(--ink)}
dl.sp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:4px 0 0;border-top:1px solid var(--line)}
dl.sp div{padding:9px 0;border-bottom:1px solid var(--line)}
dl.sp dt{font-size:13px;color:var(--muted)}
dl.sp dd{margin:0;font-weight:700}
.info .desc{margin:0;white-space:pre-line}
.info .acts{display:grid;gap:10px;margin-top:6px;justify-content:stretch}
.info .acts .btn{width:100%;padding:14px 18px}
.info .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:820px){
  .dlg{padding:0;align-items:stretch}
  .dlg .panel{grid-template-columns:1fr;border-radius:0;max-height:none;height:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .dlg .x{top:calc(10px + env(safe-area-inset-top,0px))}
}

/* financing / trade-in */
.fin-sec .wrap{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
.fin-card{background:var(--navy);color:#fff;border-radius:18px;padding:32px 30px}
.fin-card h2{font-size:clamp(30px,4vw,44px);font-weight:800;font-stretch:125%;text-transform:uppercase;line-height:1}
.fin-card p{color:#C6D3E1;margin:14px 0 0;font-size:17px;max-width:48ch}
.steps{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:14px;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:44px;height:44px;border-radius:50%;background:var(--chrome);color:var(--navy);display:grid;place-items:center;font-weight:900;font-stretch:125%;font-size:20px}
.steps b{display:block;font-size:17px}
.steps span{color:#AFC0D2;font-size:15px}
.form-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px 26px;display:grid;gap:14px}
.form-card h3{font-size:24px;font-weight:800;font-stretch:115%;color:var(--navy)}
.form-card .sub{margin:-8px 0 0;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{display:grid;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:14px;font-weight:600;color:#2A3B4F}
.field input,.field select,.field textarea{width:100%;border:1.5px solid #B9C5D2;border-radius:10px;padding:10px 12px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy);outline:none}
.field textarea{min-height:88px;resize:vertical}
.pmf{display:flex;gap:8px;flex-wrap:wrap}
.pmf .t{position:relative;width:84px;height:63px;border-radius:8px;overflow:hidden;background:#DDE4EB}
.pmf .t img{width:100%;height:100%;object-fit:cover}
.pmf .t button{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(4,18,31,.8);color:#fff;cursor:pointer;line-height:1;font-size:16px}
.pmf .addp{position:relative;overflow:hidden;width:84px;height:63px;border:2px dashed #9FB0C2;border-radius:8px;display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--navy);cursor:pointer;background:#fff}

function $(s,r){return (r||document).querySelector(s);}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function expired(o){ return o.hasta && o.hasta < today(); }
function col(n){ return COLORS[n]||COLORS.navy; }
function catById(id){ for(var i=0;i<state.categorias.length;i++) if(state.categorias[i].id===id) return state.categorias[i]; return state.categorias[0]||{id:"",nombre:"Otros",color:"navy"}; }
function vehById(id){ for(var i=0;i<state.vehiculos.length;i++) if(state.vehiculos[i].id===id) return state.vehiculos[i]; return null; }
function title(v){ return ((v.marca||"")+" "+(v.modelo||"")).trim() || "Vehículo"; }
function fullName(v){ return (title(v)+(v.version?" "+v.version:"")).trim(); }
function src(ref){ if(!ref) return ""; if(ref.indexOf("img:")===0) return IMGS[ref.slice(4)]||""; return ref; }
function fotos(v){ return (v.fotos||[]).map(src).filter(Boolean); }
function num(n){ return Number(n).toLocaleString("es-AR",{maximumFractionDigits:0}); }
function money(n,m){ if(n==null||n===""||isNaN(n)) return ""; return (m==="USD"?"US$ ":"$ ")+num(n); }
function short(n,m){
  if(n==null||n===""||isNaN(n)) return "";
  if(m==="USD") return "US$ "+num(n);
  if(n>=1000000){ var x=n/1000000; return "$"+x.toLocaleString("es-AR",{maximumFractionDigits:(x<100 && Math.round(x*10)!==Math.round(x)*10)?1:0})+"M"; }
  return "$ "+num(n);
}
function kmTxt(v){ if(v.km==null||v.km==="") return ""; return v.km===0?"0 km":num(v.km)+" km"; }
function specLine(v){ return [v.anio, kmTxt(v)].filter(Boolean).join(" | "); }
function visible(v){ return v.estado!=="oculto"; }
function selling(v){ return v.estado!=="oculto" && v.estado!=="vendido"; }
function liveOffers(){ return state.ofertas.filter(function(o){ var v=vehById(o.vehId); return o.activa && !expired(o) && v && selling(v); }); }
function offerFor(vid){ var l=liveOffers(); for(var i=0;i<l.length;i++) if(l[i].vehId===vid) return l[i]; return null; }
function priceOf(v){ var o=offerFor(v.id); if(o && o.ahora) return o.ahora; return v.precio||null; }
function pct(a,b){ if(!a||!b||b>=a) return 0; return Math.round((1-b/a)*100); }
function fmtDate(s){ if(!s) return ""; var p=s.split("-"); return p[2]+"/"+p[1]; }
function bandOf(v,o){ var t=(o&&o.banda)||v.financ||""; var c=(o&&o.bandaColor)||"go"; return t?{t:t,c:c}:null; }
function bandHtml(b){ return b?'<span class="band" style="--b:'+col(b.c)+';--bt:'+(LIGHT_TEXT[b.c]?"#fff":"#04121F")+'">'+esc(b.t)+'</span>':''; }
function wa(text){ var n=(state.settings.whatsapp||"").replace(/\D/g,""); return "https://wa.me/"+n+"?text="+encodeURIComponent(text); }
function slug(s){ return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function vehMsg(v){ var p=priceOf(v); return "¡Hola Ruta Sur! Me interesa el "+fullName(v)+(v.anio?" "+v.anio:"")+(p?" ("+money(p,v.moneda)+")":"")+". ¿Sigue disponible?"; }

var WA_ICON = '<svg viewBox="0 0 32 32" width="20" height="20" aria-hidden="true"><path fill="#fff" d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3zm0 23.6c-2 0-3.9-.5-5.6-1.5l-.4-.2-3.9 1 1-3.8-.3-.4A10.6 10.6 0 1 1 16 26.6zm5.8-7.9c-.3-.2-1.9-.9-2.2-1s-.5-.2-.7.2-.8 1-1 1.2-.4.2-.7 0a8.7 8.7 0 0 1-4.3-3.8c-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.4c-.3-.6-.5-.5-.7-.5h-.6c-.2 0-.6.1-.9.4s-1.2 1.1-1.2 2.8 1.2 3.2 1.4 3.5c.2.2 2.4 3.7 5.8 5.2 2.2.9 3 1 4.1.8.7-.1 1.9-.8 2.2-1.5s.3-1.3.2-1.5c-.1-.1-.3-.2-.6-.4z"/></svg>';
var CAR_SVG = '<svg viewBox="0 0 120 50" aria-hidden="true"><path d="M8 34c0-6 4-9 10-10l14-3 14-10c4-3 8-4 13-4h22c5 0 9 2 12 5l9 10 8 2c4 1 6 4 6 8v6H8z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><circle cx="30" cy="40" r="7" fill="#0A2744" stroke="#fff" stroke-width="3"/><circle cx="92" cy="40" r="7" fill="#0A2744" stroke="#fff" stroke-width="3"/><path d="M50 22l10-8h14v8zM80 14h10l6 8H80z" fill="#fff" opacity=".5"/></svg>';

function photo(v, i){
  var f=fotos(v), s=f[i||0];
  if(s) return '<img src="'+s+'" alt="'+esc(fullName(v))+'" loading="lazy">';
  return '<div class="ph" style="--c:'+col(catById(v.cat).color)+'" role="img" aria-label="'+esc(fullName(v))+' (sin foto)">'+CAR_SVG+'</div>';
}

/* ------------------------------ carrusel de fotos en tarjetas ------------------------------ */
var CI = {};
function slidesInner(v){
  var fs=fotos(v), n=fs.length, i=n?((CI[v.id]||0)%n+n)%n:0, nm=esc(fullName(v));
  if(n<2) return photo(v,0);
  return photo(v,i)+
    '<button class="tapnext" data-act="cnext" data-id="'+v.id+'" aria-label="Ver la foto siguiente de '+nm+'"></button>'+
    '<button class="cnav cprev" data-act="cprev" data-id="'+v.id+'" aria-label="Foto anterior de '+nm+'">‹</button>'+
    '<button class="cnav cnext" data-act="cnext" data-id="'+v.id+'" aria-label="Foto siguiente de '+nm+'">›</button>'+
    '<span class="cctr">'+(i+1)+' / '+n+'</span>'+
    '<span class="dots" aria-hidden="true">'+fs.map(function(_,k){ return '<i'+(k===i?' class="on"':'')+'></i>'; }).join("")+'</span>';
}
function slides(v){ return '<div class="slides" data-media="'+v.id+'">'+slidesInner(v)+'</div>'; }
function stepCard(id,d){
  var v=vehById(id); if(!v) return; var n=fotos(v).length; if(n<2) return;
  CI[id]=(((CI[id]||0)+d)%n+n)%n;
  var focusAct=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.act:null;
  document.querySelectorAll('[data-media="'+id+'"]').forEach(function(el){
    var had=el.contains(document.activeElement);
    el.innerHTML=slidesInner(v);
    if(had && focusAct){ var b=el.querySelector('.cnav[data-act="'+focusAct+'"]')||el.querySelector('.cnav.cnext'); if(b) b.focus(); }
  });
}
var touchX=null, touchEl=null;
document.addEventListener("touchstart",function(e){ var el=e.target.closest("[data-media],.gal .main"); touchEl=el; touchX=el?e.touches[0].clientX:null; },{passive:true});
document.addEventListener("touchend",function(e){
  if(touchX==null||!touchEl) return; var dx=e.changedTouches[0].clientX-touchX, el=touchEl; touchX=null; touchEl=null;
  if(Math.abs(dx)<40) return;
  if(el.dataset && el.dataset.media){ stepCard(el.dataset.media, dx<0?1:-1); }
  else if(ui.open){ var n=fotos(vehById(ui.open)).length; if(n>1){ ui.gi=(ui.gi+(dx<0?1:-1)+n)%n; renderDetail(); } }
},{passive:true});

/* ------------------------------ public render ------------------------------ */
function storyCard(v,o){
  var p=(o&&o.ahora)||v.precio, m=v.moneda, d=o?pct(o.antes,o.ahora):0;
  return '<article class="story">'+
    '<div class="media">'+slides(v)+(o&&o.etiqueta?'<span class="tag">'+esc(o.etiqueta)+'</span>':'')+(d?'<span class="sticker">-'+d+'%</span>':'')+'</div>'+
    '<div class="body"><h3>'+esc(title(v))+'</h3>'+(v.version?'<p class="ver">'+esc(v.version)+'</p>':'')+
    (specLine(v)?'<p class="spec">'+esc(specLine(v))+'</p>':'')+
    (p?'<div class="big price">'+short(p,m)+'</div>'+(o&&o.antes&&o.ahora&&o.antes>o.ahora?'<div class="old price">'+money(o.antes,m)+'</div>':''):'<div class="big ask">Consultá precio</div>')+
    bandHtml(bandOf(v,o))+
    (o&&o.hasta?'<span class="until">Válida hasta el '+fmtDate(o.hasta)+'</span>':'')+
    '<div class="actions"><button class="btn btn-chrome btn-sm" data-open="'+v.id+'">Ver detalle</button>'+
    '<a class="btn btn-wa btn-sm" target="_blank" rel="noopener" href="'+wa(vehMsg(v))+'">'+WA_ICON+'Consultar</a></div></div></article>';
}
function carCard(v){
  var o=offerFor(v.id), p=priceOf(v), c=catById(v.cat), n=fotos(v).length;
  var sold=v.estado==="vendido", res=v.estado==="reservado";
  var flag = sold?'<span class="ribbon">Vendido</span>':res?'<span class="flag res">Reservado</span>':o?'<span class="flag">Oferta</span>':(v.destacado?'<span class="flag star">Destacado</span>':'');
  var chips=[v.anio, kmTxt(v), v.caja, v.combustible].filter(Boolean);
  return '<article class="car'+(sold?' sold':'')+'"><div class="media">'+slides(v)+flag+'</div>'+
    '<div class="body"><span class="cat"><i style="background:'+col(c.color)+'"></i>'+esc(c.nombre)+'</span>'+
    '<h3><button class="open" data-open="'+v.id+'">'+esc(title(v))+'</button></h3>'+(v.version?'<p class="ver">'+esc(v.version)+'</p>':'')+
    (chips.length?'<div class="specs">'+chips.map(function(x){return '<span>'+esc(x)+'</span>';}).join("")+'</div>':'')+
    (v.financ&&!sold?'<p class="fin">'+esc(v.financ)+'</p>':'')+
    '<div class="foot">'+(sold?'<span class="pr ask">Vendido</span>':(p?'<span class="pr price">'+short(p,v.moneda)+'</span>':'<span class="pr ask">Consultá precio</span>'))+
    (sold?'':'<a class="btn btn-wa btn-sm btn-icon" aria-label="Consultar por WhatsApp" target="_blank" rel="noopener" href="'+wa(vehMsg(v))+'">'+WA_ICON+'</a>')+'</div></div></article>';
}

function renderCats(){
  var list=state.vehiculos.filter(visible), counts={};
  list.forEach(function(v){counts[v.cat]=(counts[v.cat]||0)+1;});
  var h='<button class="chip" data-cat="all" aria-pressed="'+(ui.cat==="all")+'"><i style="background:var(--silver)"></i>Todos <small>'+list.length+'</small></button>';
  state.categorias.forEach(function(c){
    if(!counts[c.id] && ui.cat!==c.id) return;
    h+='<button class="chip" data-cat="'+esc(c.id)+'" aria-pressed="'+(ui.cat===c.id)+'"><i style="background:'+col(c.color)+'"></i>'+esc(c.nombre)+' <small>'+(counts[c.id]||0)+'</small></button>';
  });
  $("#cats").innerHTML=h;
}
function renderGrid(){
  var q=ui.q.trim().toLowerCase();
  var list=state.vehiculos.filter(function(v){
    if(!visible(v)) return false;
    if(ui.cat!=="all" && v.cat!==ui.cat) return false;
    if(q && (fullName(v)+" "+(v.anio||"")+" "+catById(v.cat).nombre+" "+(v.combustible||"")+" "+(v.caja||"")).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  var big=Number.MAX_SAFE_INTEGER;
  list.sort(function(a,b){
    var sa=a.estado==="vendido"?1:0, sb=b.estado==="vendido"?1:0; if(sa!==sb) return sa-sb;
    if(ui.sort==="pasc") return (priceOf(a)||big)-(priceOf(b)||big);
    if(ui.sort==="pdesc") return (priceOf(b)||0)-(priceOf(a)||0);
    if(ui.sort==="anio") return (b.anio||0)-(a.anio||0);
    if(ui.sort==="km") return (a.km==null?big:a.km)-(b.km==null?big:b.km);
    function sc(v){ return (v.destacado?4:0)+(offerFor(v.id)?2:0)+(fotos(v).length?1:0); }
    return sc(b)-sc(a);
  });
  var total=list.length; list=list.slice(0,ui.limit);
  if(!list.length){ $("#grid").innerHTML='<div class="empty" style="grid-column:1/-1">No hay vehículos publicados con esa búsqueda. <a href="'+wa("¡Hola Ruta Sur! Estoy buscando: "+ui.q)+'" target="_blank" rel="noopener"><b>Contanos qué buscás por WhatsApp</b></a> y te avisamos.</div>'; return; }
  $("#grid").innerHTML=list.map(carCard).join("")+(total>list.length?'<div class="more"><button class="btn btn-navy" data-act="more">Ver más vehículos ('+(total-list.length)+')</button></div>':'');
}

/* ------------------------------ detail ------------------------------ */
function renderDetail(){
  var box=$("#detail"); if(!box) return;
  var v=ui.open?vehById(ui.open):null;
  if(!v){ box.innerHTML=""; syncLock(); return; }
  var fs=fotos(v), i=Math.max(0,Math.min(ui.gi,fs.length-1)), o=offerFor(v.id), p=priceOf(v), c=catById(v.cat);
  var sold=v.estado==="vendido", res=v.estado==="reservado";
  var rows=[["Año",v.anio],["Kilómetros",kmTxt(v)],["Transmisión",v.caja],["Combustible",v.combustible],["Color",v.color],["Tipo",c.nombre]].filter(function(r){return r[1];});
  var h='<div class="dlg" data-act="closebg" role="dialog" aria-modal="true" aria-label="'+esc(fullName(v))+'"><div class="panel">'+
    '<button class="x" data-act="close" aria-label="Cerrar">×</button>'+
    '<div class="gal"><div class="main">'+photo(v,i)+(sold?'<span class="ribbon">Vendido</span>':'')+

function loadImg(s){ return new Promise(function(res){ if(!s) return res(null); var i=new Image(); i.onload=function(){res(i);}; i.onerror=function(){res(null);}; i.src=s; }); }
function cover(x,im,dx,dy,dw,dh){ var r=Math.max(dw/im.width,dh/im.height), sw=dw/r, sh=dh/r; x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,dx,dy,dw,dh); }
function setF(x,w,px,wide){ x.font=w+" "+px+"px Archivo, Arial, sans-serif"; if("fontStretch" in x) x.fontStretch=wide?"expanded":"normal"; }
function fitF(x,text,w,px,wide,maxW){ setF(x,w,px,wide); while(x.measureText(text).width>maxW && px>20){ px-=2; setF(x,w,px,wide); } return px; }
function storyImage(v,o){
  var W=1080,H=1920,cv=document.createElement("canvas"); cv.width=W; cv.height=H; var x=cv.getContext("2d");
  var ready=(document.fonts&&document.fonts.load)?Promise.all([document.fonts.load("900 100px Archivo"),document.fonts.load("600 40px Archivo")]).catch(function(){}):Promise.resolve();
  var fs=fotos(v);
  return ready.then(function(){ return Promise.all([loadImg(fs[0]),loadImg(IMGS.logo),loadImg(fs[1]),loadImg(fs[2])]); }).then(function(im){
    var s=state.settings, ph=880, p=(o&&o.ahora)||v.precio, b=bandOf(v,o);
    x.fillStyle="#070D16"; x.fillRect(0,0,W,H);
    if(im[0] && im[2] && im[3]){ cover(x,im[0],0,0,W,540); cover(x,im[2],0,546,W/2-3,ph-546); cover(x,im[3],W/2+3,546,W/2-3,ph-546); }
    else if(im[0]) cover(x,im[0],0,0,W,ph); else { x.fillStyle="#0B3A66"; x.fillRect(0,0,W,ph); }
    var sold=v.estado==="vendido";
    if(sold){ x.save(); x.translate(W/2,ph/2); x.rotate(-0.24); x.fillStyle="#fff"; x.fillRect(-W,-78,2*W,156); x.fillStyle="#E23B2E"; x.fillRect(-W,-70,2*W,140); x.fillStyle="#fff"; setF(x,"900",100,true); x.textAlign="center"; x.textBaseline="middle"; x.fillText("VENDIDO",0,6); x.restore(); x.textAlign="left"; x.textBaseline="alphabetic"; }
    var g=x.createLinearGradient(0,ph-200,0,ph); g.addColorStop(0,"rgba(7,13,22,0)"); g.addColorStop(1,"rgba(7,13,22,1)"); x.fillStyle=g; x.fillRect(0,ph-200,W,200);
    if(o && o.etiqueta){ setF(x,"700",34,false); var tw=x.measureText(o.etiqueta).width+48; x.fillStyle="#fff"; x.beginPath(); if(x.roundRect) x.roundRect(40,40,tw,62,31); else x.rect(40,40,tw,62); x.fill(); x.fillStyle="#062B4D"; x.textBaseline="middle"; x.fillText(o.etiqueta,64,72); x.textBaseline="alphabetic"; }
    var lw=440, lh=im[1]?lw*im[1].height/im[1].width:260, bx=(W-560)/2, by=ph+10;
    x.fillStyle="#053661"; x.fillRect(bx,by,560,lh+50);
    if(im[1]) x.drawImage(im[1],(W-lw)/2,by+25,lw,lh);
    var y=by+lh+50+100;
    x.textAlign="center"; x.fillStyle="#fff";
    fitF(x,title(v).toUpperCase(),"900",80,true,W-100); x.fillText(title(v).toUpperCase(),W/2,y);
    var sub=[v.version,specLine(v)].filter(Boolean).join(" | ");
    if(sub){ y+=62; x.fillStyle="#C3CEDA"; fitF(x,sub.toUpperCase(),"600",38,false,W-120); x.fillText(sub.toUpperCase(),W/2,y); }
    if(sold){ p=null; b=null; }
    y+=p?200:130; x.fillStyle="#fff";
    var pt=sold?"¡GRACIAS POR ELEGIRNOS!":(p?short(p,v.moneda):"CONSULTÁ PRECIO");
    fitF(x,pt,"900",p?210:90,true,W-100); x.fillText(pt,W/2,y);
    if(b){ y+=40; var bh=96; x.fillStyle=col(b.c); x.fillRect(110,y,W-220,bh); x.fillStyle=LIGHT_TEXT[b.c]?"#fff":"#04121F"; fitF(x,b.t.toUpperCase(),"800",50,true,W-280); x.textBaseline="middle"; x.fillText(b.t.toUpperCase(),W/2,y+bh/2+3); x.textBaseline="alphabetic"; }
    x.fillStyle="#1FB855"; x.fillRect(0,H-150,W,80); x.fillStyle="#fff"; setF(x,"800",44,true); x.textBaseline="middle"; x.fillText("WHATSAPP: "+(s.whatsappVisible||""),W/2,H-110);
    x.fillStyle="#9FB0C2"; setF(x,"600",30,false); x.fillText("RUTA SUR AUTOMOTORES | "+String(s.ciudad||"").toUpperCase(),W/2,H-38);
    return new Promise(function(res){ cv.toBlob(function(bl){ res(bl); },"image/png"); });
  });
}

function clearHist(){ HIST.urls.forEach(function(u){ URL.revokeObjectURL(u); }); HIST.urls=[]; HIST.blobs=[]; HIST.note=""; }
function genHist(){
  var vs=histSel(); if(!vs.length) return;
  clearHist(); HIST.busy=true; renderAdmin();
  var job = HIST.modo==="todos" ? storyCollage(vs,HIST.titulo).then(function(b){ return [b]; })
    : vs.reduce(function(pr,v){ return pr.then(function(arr){ return storyImage(v,offerFor(v.id)).then(function(b){ arr.push(b); return arr; }); }); }, Promise.resolve([]));
  job.then(function(blobs){
    HIST.blobs=blobs; HIST.urls=blobs.map(function(b){ return URL.createObjectURL(b); }); HIST.busy=false; renderAdmin();
    var r=$("#hres"); if(r) r.scrollIntoView({block:"start",behavior:"smooth"});
  }, function(){ HIST.busy=false; HIST.note="No se pudieron generar. Probá de nuevo."; renderAdmin(); });
}
function histFiles(){ return HIST.blobs.map(function(b,i){ return new File([b],"historia-"+(i+1)+".png",{type:"image/png"}); }); }
function shareHist(){
  var files=histFiles();
  if(navigator.share && navigator.canShare && navigator.canShare({files:files})){
    navigator.share({files:files}).then(function(){ HIST.note="Listo."; renderAdmin(); }, function(e){ if(e && e.name!=="AbortError"){ downHist(); } });
  } else downHist();
}
function downHist(){
  HIST.blobs.forEach(function(b,i){ setTimeout(function(){ downloadBlob(b,"historia-"+(i+1)+".png"); }, i*400); });
  HIST.note=HIST.blobs.length>1?"Si el navegador pregunta, permití descargar varios archivos.":""; renderAdmin();
}
function storyCollage(vs,titulo){

    var s=state.settings;

    if(im[0]){ var lh=200, lw=im[0].width*lh/im[0].height; x.drawImage(im[0],40,50,lw,lh); }
    x.fillStyle="#fff"; x.textAlign="left"; fitF(x,String(titulo||"").toUpperCase(),"900",64,true,W-430); x.fillText(String(titulo||"").toUpperCase(),400,150);

      var r=Math.floor(i/cols), c=i%cols, span=(cols===2 && n%2===1 && i===n-1);
      var tw=span?W-2*mx:(W-2*mx-(cols-1)*gap)/cols, tx=mx+(span?0:c*(tw+gap)), ty=top+r*(th+gap);
      x.save(); x.beginPath(); if(x.roundRect) x.roundRect(tx,ty,tw,th,18); else x.rect(tx,ty,tw,th); x.clip();
      if(im[i+1]) cover(x,im[i+1],tx,ty,tw,th); else { x.fillStyle="#0B3A66"; x.fillRect(tx,ty,tw,th); }
      var g=x.createLinearGradient(0,ty+th*.38,0,ty+th); g.addColorStop(0,"rgba(7,13,22,0)"); g.addColorStop(1,"rgba(7,13,22,.94)"); x.fillStyle=g; x.fillRect(tx,ty,tw,th);
      var sold=v.estado==="vendido", o=offerFor(v.id), p=sold?null:priceOf(v), b=sold?null:bandOf(v,o);
      if(sold){ x.save(); x.translate(tx+tw/2,ty+th*.4); x.rotate(-0.24); x.fillStyle="#fff"; x.fillRect(-tw,-38,2*tw,76); x.fillStyle="#E23B2E"; x.fillRect(-tw,-33,2*tw,66); x.fillStyle="#fff"; setF(x,"900",46,true); x.textAlign="center"; x.textBaseline="middle"; x.fillText("VENDIDO",0,3); x.restore(); }
      if(b){ setF(x,"800",24,true); var bt=b.t.toUpperCase(), bw=Math.min(tw-36,x.measureText(bt).width+28); x.fillStyle=col(b.c); x.fillRect(tx+18,ty+18,bw,44); x.fillStyle=LIGHT_TEXT[b.c]?"#fff":"#04121F"; x.textBaseline="middle"; x.textAlign="left"; fitF(x,bt,"800",24,true,bw-28); x.fillText(bt,tx+32,ty+41); x.textBaseline="alphabetic"; }
      var ps=Math.min(90,th*.17), ns=Math.min(50,th*.1), ss=Math.round(ns*.62), px=tx+24, mw=tw-48;
      var py=ty+th-26, sy=py-(p?ps:ns*.9)-10, ny=sy-ss-10;
      x.textAlign="left"; x.fillStyle="#fff";
      fitF(x,title(v).toUpperCase(),"900",ns,true,mw); x.fillText(title(v).toUpperCase(),px,ny);
      var sub=[v.version,specLine(v)].filter(Boolean).join(" | ");
      x.fillStyle="#C3CEDA"; fitF(x,sub.toUpperCase(),"600",ss,false,mw); x.fillText(sub.toUpperCase(),px,sy);
      x.fillStyle="#fff"; var pt=sold?"¡GRACIAS!":(p?short(p,v.moneda):"CONSULTÁ PRECIO"); fitF(x,pt,"900",p?ps:ns*.9,true,mw); x.fillText(pt,px,py);
      x.restore();
    });
    x.textAlign="center"; x.fillStyle="#1FB855"; x.fillRect(0,H-150,W,80); x.fillStyle="#fff"; setF(x,"800",44,true); x.textBaseline="middle"; x.fillText("WHATSAPP: "+(s.whatsappVisible||""),W/2,H-110);
    x.fillStyle="#9FB0C2"; setF(x,"600",30,false); x.fillText("RUTA SUR AUTOMOTORES | "+String(s.ciudad||"").toUpperCase(),W/2,H-38);

function findItem(c,id){ if(c==="settings") return state.settings; var a=state[c]; for(var i=0;i<a.length;i++) if(a[i].id===id) return a[i]; return null; }

var NUMS={anio:1,km:1,precio:1,antes:1,ahora:1};
function onInput(e){
  var t=e.target;
  if(t.id==="q"){ ui.q=t.value; ui.limit=12; renderGrid(); return; }
  if(t.id==="sort"){ ui.sort=t.value; renderGrid(); return; }
  if(t.id==="pm-file") return;
  if(t.id && t.id.indexOf("pm-")===0){ ui.perm[t.id.slice(3)]=t.value; return; }
  if(t.id && t.id.indexOf("bulk")===0){ var b=ui.bulk; if(t.id==="bulkPct") b.pct=t.value; if(t.id==="bulkRound") b.round=t.value; if(t.id==="bulkInc") b.inc=t.checked; b.confirm=false; var bc=$("#bulkBox"); if(bc) bc.outerHTML=bulkBox(); return; }
  if(t.dataset && t.dataset.hsel){ if(t.checked) HIST.sel[t.dataset.hsel]=true; else delete HIST.sel[t.dataset.hsel]; clearHist(); renderAdmin(); focusBack(t.id); return; }
  if(t.name==="hmodo"){ HIST.modo=t.value; clearHist(); renderAdmin(); var r=document.querySelector('input[name="hmodo"][value="'+t.value+'"]'); if(r) r.focus(); return; }
  if(t.id==="h-titulo"){ HIST.titulo=t.value; return; }
  if(t.id==="pw1"||t.id==="pw2"||t.id==="lk-pass") return;
  if(t.id==="aq"){ ui.aq=t.value; var l=$("#alist"); if(l) l.innerHTML=admRows(); return; }
  if(!t.dataset || !t.dataset.c || !t.dataset.k) return;
  var it=findItem(t.dataset.c,t.dataset.id); if(!it) return;
  var k=t.dataset.k, v;
  if(t.type==="checkbox") v=t.checked;
  else if(t.type==="number" || NUMS[k]) v=t.value===""?null:Math.max(0,Math.round(Number(t.value)));
  else v=t.value;
  if(t.type==="number" && isNaN(v)) return;
  it[k]=v; ui.msg="";
  if(t.dataset.c==="ofertas" && k==="vehId"){ var nv=vehById(v); if(nv && !it.banda) it.banda=nv.financ||""; }
  refreshStatus();
  if(t.type==="checkbox" || t.tagName==="SELECT"){ renderPublicOnly(); renderAdmin(); focusBack(t.id); }
  else renderPublicSoon();
}

function resizeImage(file){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(){ var img=new Image();
      img.onload=function(){ var max=1000, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1,max/Math.max(w,h));
        var cv=document.createElement("canvas"); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
        var ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL("image/jpeg",0.72)); };
      img.onerror=function(){ res(null); }; img.src=r.result; };
    r.onerror=function(){ res(null); }; r.readAsDataURL(file);
  });
}

function onChange(e){

/* ------------------------------ clave de acceso ------------------------------ */
function sha256(str){
  var ascii=unescape(encodeURIComponent(str));
  function rr(v,a){return (v>>>a)|(v<<(32-a));}
  var mp=Math.pow, mw=mp(2,32), i, j, result="", words=[], bl=ascii.length*8, hash=[], k=[], pc=0, ic={};
  for(var c=2; pc<64; c++){ if(!ic[c]){ for(i=0;i<313;i+=c) ic[i]=c; hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
  hash=hash.slice(0,8);
  ascii+="\x80";
  while(ascii.length%64-56) ascii+="\x00";
  for(i=0;i<ascii.length;i++){ j=ascii.charCodeAt(i); words[i>>2]|=j<<((3-i)%4)*8; }
  words[words.length]=((bl/mw)|0); words[words.length]=(bl);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16), oh=hash; hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0;
    }
    for(i=0;i<8;i++) hash[i]=(hash[i]+oh[i])|0;
  }
  for(i=0;i<8;i++) for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:"")+b.toString(16); }
  return result;
}
function passHash(salt,pw){ return sha256(salt+":"+pw); }
