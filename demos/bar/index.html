const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const NOW=new Date();const HOY=iso(NOW);const VOFF=new Date(HOY+'T22:15:00').getTime()-Date.now();const vnow=()=>Date.now()+VOFF;const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};

function route(){let h=location.hash.slice(1)||NAV[ROLE][0][0];if(h==='stock')h='stock/articulos';if(h==='tableros')h='tableros/resumen';const top=h.split('/')[0];
 if(!NAV[ROLE].some(n=>n[0]===top)){h=NAV[ROLE][0][0]}if(!VIEWS[h])h=NAV[ROLE][0][0];const c=counts();
 $('#nav').innerHTML=NAV[ROLE].map(([k,l])=>`<a href="#${k}" class="${h.split('/')[0]===k?'on':''}">${l}${c[k]?`<span class="dot">${c[k]}</span>`:''}</a>`).join('');
 $('#main').innerHTML=VIEWS[h]()+'<p class="proto">Demo con datos ficticios: el bar, los platos, precios, proveedores y clientes son inventados. Los cambios se ven al instante pero se pierden al recargar.</p>';wire(h);window.scrollTo(0,0)}
function keep(){const y=scrollY;route();scrollTo(0,y)}
function wire(v){
 $$('[data-mesa]').forEach(b=>b.onclick=()=>{carrito=[];catSel='Parrilla';panelMesa(b.dataset.mesa)});
 $$('[data-atend]').forEach(b=>b.onclick=()=>{LLAMADOS=LLAMADOS.filter(x=>x!==b.dataset.atend);toast('Listo, la mesa ve que vas.');keep()});
 $$('[data-confqr]').forEach(b=>b.onclick=()=>{const p=PED.find(x=>x.id===b.dataset.confqr);p.conf=true;p.t=vnow();const m=mesa(p.mesa);if(m.estado==='libre')abrir(m,2,'Flor',0);toast('Confirmado: ya está en la parrilla y la barra.');keep()});
 $$('[data-retiro]').forEach(b=>b.onclick=()=>{const p=PED.find(x=>x.id===b.dataset.retiro);if(p.ec==='listo')p.ec='entregado';if(p.eb==='listo')p.eb='entregado';keep()});
 $$('[data-sentar]').forEach(b=>b.onclick=()=>sentarModal(RES.find(r=>r.id===b.dataset.sentar)));
 const sm=$('#sinMesa');if(sm)sm.onclick=sinMesaModal;
 $$('[data-av]').forEach(b=>b.onclick=()=>{const [id,campo,sig]=b.dataset.av.split('|');const p=PED.find(x=>x.id===id);p[campo]=sig;if(sig==='listo')toast('El mozo ve que tiene que retirar.');keep()});
 if(v==='reservas'){$$('[data-rdia]').forEach(a=>a.onclick=e=>{e.preventDefault();resDia=a.dataset.rdia;keep()});
  $('#rLink').onclick=()=>modal(`<h3>Link y QR para clientes</h3><p class="small muted">Compartilo en Instagram y WhatsApp o imprimí el QR. El cliente elige día, horario y cuántos son.</p><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><div style="width:130px;height:130px;background:var(--cuadros);border:8px solid #fff;outline:1px solid var(--line);border-radius:8px"></div><div><b>larecta.ejemplo/reservar</b><p class="small muted" style="margin:4px 0 0">Una reserva por teléfono y noche, cupo por horario y freno a pedidos en masa.</p></div></div><div class="acts"><button class="btn" data-x>Cerrar</button></div>`);
  $('#rNew').onclick=()=>{modal(`<h3>Nueva reserva</h3><p class="small muted" style="margin:0 0 10px">Las que tomás por teléfono o en el local entran confirmadas.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo">Nombre<input id="nN"></label><label class="campo">Celular<input id="nT" placeholder="Con código de área"></label><label class="campo">Día<input type="date" id="nF" value="${resDia}" min="${HOY}"></label><label class="campo">Horario<select id="nH">${HORARIOS.map(h=>`<option>${h}</option>`).join('')}</select></label><label class="campo">Personas<input type="number" id="nP" value="2" min="1"></label><label class="campo">Nota<input id="nNo"></label></div><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="nOk">Guardar reserva</button></div>`);
   $('#nOk').onclick=()=>{const n=$('#nN').value.trim();if(!n){toast('Poné el nombre.');return}const f=$('#nF').value||HOY,h=$('#nH').value,p=+$('#nP').value||2;const oc=RES.filter(r=>r.f===f&&r.h===h&&r.est!=='cancelada').reduce((s,r)=>s+r.pax,0);if(oc+p>CUPO){toast('No hay lugar en ese horario: quedan '+(CUPO-oc)+'.');return}RES.push({id:'r'+nrs++,f,h,n,pax:p,tel:$('#nT').value,orig:'telefono',est:'confirmada',nota:$('#nNo').value});resDia=f;closeM();toast('Reserva guardada.');keep()}};
  $$('[data-rconf]').forEach(b=>b.onclick=()=>{const r=RES.find(x=>x.id===b.dataset.rconf);r.est='confirmada';keep();waMsg(`¡Hola ${r.n}! Te confirmamos la reserva en La Recta para ${r.pax} personas el ${DL[new Date(r.f+'T12:00:00').getDay()]} ${fd(r.f)} a las ${r.h}. ¡Te esperamos!`)});
  $$('[data-rno]').forEach(b=>b.onclick=()=>{const r=RES.find(x=>x.id===b.dataset.rno);r.est='cancelada';keep();waMsg(`¡Hola ${r.n}! Te pedimos disculpas: para el ${fd(r.f)} a las ${r.h} ya no tenemos lugar. ¿Te sirve otro horario?`)})}
 if(v==='caja'){$$('[data-cob]').forEach(b=>b.onclick=()=>cobrar(mesa(b.dataset.cob)));const g=$('#cjG');if(g)g.onclick=()=>{modal(`<h3>Gasto con la plata de la caja</h3><label class="campo">Concepto<input id="gC" placeholder="Hielo, un proveedor…"></label><label class="campo" style="margin-top:10px">Monto ($)<input id="gM" type="number" min="0"></label><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="gOk">Guardar gasto</button></div>`);$('#gOk').onclick=()=>{const m=+$('#gM').value;if(!$('#gC').value.trim()||!m){toast('Completá concepto y monto.');return}CAJA.gastos.push({c:$('#gC').value.trim(),m,t:vnow()});closeM();toast('Gasto registrado.');keep()}};
  const c=$('#cjC');if(c)c.onclick=()=>{const T=tkHoy();const ef=T.filter(t=>t.medio.startsWith('Efectivo')).reduce((s,t)=>s+t.total,0);const gas=CAJA.gastos.reduce((s,g)=>s+g.m,0);const esp=CAJA.inicial+ef-gas;
   modal(`<h3>Cerrar caja</h3><div class="row"><span class="grow">Inicial</span><span class="r">${plata(CAJA.inicial)}</span></div><div class="row"><span class="grow">Cobrado en efectivo</span><span class="r">${plata(ef)}</span></div><div class="row"><span class="grow">Gastos de caja</span><span class="r">−${plata(gas)}</span></div><div class="row"><b class="grow">Debería haber</b><b class="r">${plata(esp)}</b></div><label class="campo" style="margin-top:10px">Efectivo contado ($)<input id="zC" type="number" min="0"></label><div id="zD" class="small" style="margin-top:6px"></div>${MESAS.some(m=>m.estado!=='libre')?'<div class="alert" style="margin-top:10px">Todavía hay mesas abiertas sin cobrar.</div>':''}<div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="zOk">Cerrar caja</button></div>`);
   $('#zC').oninput=e=>{const d=(+e.target.value||0)-esp;$('#zD').textContent='Diferencia: '+(d>0?'+':'')+plata(d)};$('#zOk').onclick=()=>{const cont=+$('#zC').value;if(!$('#zC').value){toast('Cargá lo que contaste.');return}CAJA.cerrada={cont,esp,dif:cont-esp};closeM();toast('Caja cerrada. Lo que se cobre ahora va a la jornada siguiente.');keep()}}}
 if(v==='stock/articulos'){$('#aNew').onclick=()=>{modal(`<h3>Nuevo artículo</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="campo">Nombre<input id="iN" placeholder="Ej: Cuadril"></label><label class="campo">Unidad<select id="iU"><option>kg</option><option>u</option><option>l</option></select></label><label class="campo">Costo por unidad<input id="iC" type="number"></label><label class="campo">Mínimo<input id="iM" type="number"></label><label class="campo">Merma de limpieza %<input id="iL" type="number" value="0"></label><label class="campo">Proveedor<input id="iP"></label></div><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="iOk">Guardar</button></div>`);
  $('#iOk').onclick=()=>{const n=$('#iN').value.trim();if(!n){toast('Poné el nombre.');return}INS.push({id:'x'+vnow(),n,u:$('#iU').value,costo:+$('#iC').value||0,hay:0,min:+$('#iM').value||0,mer:(+$('#iL').value||0)/100,rin:1,vence:null,prov:$('#iP').value||'—'});closeM();toast('Artículo creado.');keep()}}}
 if(v==='stock/recetas'){$$('[data-rec]').forEach(r=>r.onclick=()=>{recSel=r.dataset.rec;keep()});$('#rPGo').onclick=()=>{const p=prod(recSel);const np=+$('#rP').value;if(!np)return;const co=costoPlato(p);toast(`A ${plata(np)} el costo sería ${pct(co/np)} y dejaría ${plata(np-co)} por plato.`)}}
 if(v==='stock/compras'){$('#cmFac').onclick=facturaIA;$('#cmMan').onclick=()=>toast('En el sistema real cargás cada artículo con cantidad y precio; suma al stock y queda el gasto.');$('#cmWA').onclick=()=>waMsg('¡Hola! Para mañana necesitamos:\n• Entraña 6 kg\n• Mollejas 4 kg\n• Vacío 8 kg\nGracias, La Recta.')}
 if(v==='stock/control'){$('#ctInv').onclick=()=>{modal(`<h3>Inventario completo</h3><p class="small muted" style="margin:0 0 8px">Cargá lo que hay de verdad. Lo que dejes vacío no se cuenta esta vez.</p>${INS.slice(0,10).map(i=>`<div class="row"><span class="grow"><b>${esc(i.n)}</b><div class="small muted">la app dice: ${num(i.hay)} ${i.u}</div></span><input type="number" step="any" style="width:100px" aria-label="${esc(i.n)} contado"><span class="muted small" style="min-width:2em">${i.u}</span></div>`).join('')}<p class="small muted">… y el resto de los artículos.</p><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="inOk">Guardar inventario</button></div>`,true);$('#inOk').onclick=()=>{closeM();toast('Inventario guardado. Con el próximo se arma la comparación.')}}}
 if(v==='stock/mermas'){$('#meGo').onclick=()=>{const c=+$('#meC').value;if(!c){toast('Poné la cantidad.');return}const x=ins($('#meI').value);x.hay=Math.max(0,x.hay-c);MERMAS.unshift({f:HOY,i:x.id,c,mot:$('#meM').value});toast('Registrado: '+plata(c*x.costo)+' tirados. Se descontó del stock.');keep()}}
 if(v==='tableros/finanzas'){$$('[data-pagar]').forEach(b=>b.onclick=()=>{const g=GASTOS[+b.dataset.pagar];modal(`<h3>Pagar · ${esc(g.c)}</h3><label class="campo">Sale de<select>${CUENTAS.map(c=>`<option>${c[0]} (${plata(c[1])})</option>`).join('')}</select></label><div class="acts"><button class="btn" data-x>Cancelar</button><button class="btn pri" id="pgOk">Pagar ${plata(g.m)}</button></div>`);$('#pgOk').onclick=()=>{g.est='pagado';CUENTAS[1][1]-=g.m;closeM();toast('Pagado. El saldo de la cuenta se actualizó.');keep()}})}
 if(v==='carta'){$$('[data-pausa]').forEach(b=>b.onclick=()=>{const p=prod(b.dataset.pausa);p.activo=!p.activo;toast(p.activo?p.n+' vuelve a la carta.':p.n+' pausado: ya no aparece en el QR ni al mozo.');keep()});$('#qrPrint').onclick=()=>modal(`<h3>Mesas y QR</h3><p class="small muted">Imprimí la hoja y pegá cada QR en su mesa.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px">${MESAS.filter(m=>!m.temp).slice(0,8).map(m=>`<div style="text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px"><div style="height:80px;background:var(--cuadros);border-radius:4px"></div><b style="font-family:var(--disp);font-style:italic">Mesa ${m.num}</b></div>`).join('')}</div><div class="acts"><button class="btn" data-x>Cerrar</button></div>`,true)}
 if(v==='qr'){$$('[data-qcat]').forEach(b=>b.onclick=()=>{qrCat=b.dataset.qcat;keep()});$$('[data-qa]').forEach(b=>b.onclick=()=>{const e=qrCart.find(c=>c.p===b.dataset.qa);e?e.c++:qrCart.push({p:b.dataset.qa,c:1});keep()});$$('[data-qm]').forEach(b=>b.onclick=()=>{const k=qrCart.findIndex(c=>c.p===b.dataset.qm);qrCart[k].c--;if(!qrCart[k].c)qrCart.splice(k,1);keep()});
  $('#qCall').onclick=()=>{if(!LLAMADOS.includes('m4'))LLAMADOS.push('m4');toast('Listo, le avisamos al mozo.')};
  $('#qSend').onclick=()=>{const tot=qrCart.reduce((s,c)=>s+c.c*prod(c.p).precio,0);modal(`<h3>Tu pedido</h3>${qrCart.map(c=>`<div class="row"><span class="grow">${c.c}× ${esc(prod(c.p).n)}</span><span class="r">${plata(c.c*prod(c.p).precio)}</span></div>`).join('')}<label class="campo" style="margin-top:10px">Aclaración<input id="qN" placeholder="Sin sal, punto jugoso…"></label><div class="row"><b class="grow">Total</b><b class="r">${plata(tot)}</b></div><p class="small muted">El mozo confirma el pedido antes de que salga. Se paga al final, en la mesa.</p><div class="acts"><button class="btn" data-x>Seguir mirando</button><button class="btn pri" id="qOk">Mandar pedido</button></div>`);
   $('#qOk').onclick=()=>{const m=mesa('m4');pedido(m,qrCart.map((c,k)=>[c.p,c.c,k===0?$('#qN').value.trim():'']),0,'pendiente','pendiente',false);qrCart=[];closeM();toast('¡Pedido enviado! El mozo lo confirma en un momento.');keep()}}}
}
addEventListener('hashchange',route);
setInterval(()=>{if(!$('#ov').classList.contains('show')&&['mesas','cocina','barra','caja'].includes(location.hash.slice(1)))keep()},30000);

/* ---------- recorrido ---------- */
const TOUR=[['admin','mesas','1. Mesas','Así se ve el salón. Tocás una mesa libre, la abrís con los comensales y cargás el pedido.'],['cocina','cocina','2. Parrilla','La comanda llega sola. El parrillero toca Empezar y después Listo, y el mozo ve que tiene que retirar.'],['admin','caja','3. Caja','Se cobra con el medio de pago, propina y Factura C. Al cobrar se descuentan solos los artículos de cada plato.'],['qr','qr','4. Carta por QR','El cliente escanea, ve la carta, pide y llama al mozo. El mozo confirma antes de que salga.'],['admin','stock/compras','5. Compras','Qué comprar según lo que se vende cada día, y la factura se carga con una foto.'],['admin','stock/control','6. Control semanal','Lo que salió del depósito y no explican las ventas: plata que se pierde sin que nadie lo vea.'],['admin','tableros/costos','7. Qué platos convienen','Cuánto deja cada plato y cuáles subir de precio o sacar de la carta.']];
function abrirTour(){modal(`<h3>Recorrido en 2 minutos</h3><p class="small muted" style="margin:0">Sistema para un bar y parrilla: mesas, comandas, caja, stock con recetas y tableros. Tocá un paso para ir.</p><ol class="tour-list">${TOUR.map((t,i)=>`<li data-t="${i}"><span class="k">${i+1}</span><div><b>${t[2].replace(/^\d+\. /,'')}</b><span class="small muted">${t[3]}</span></div></li>`).join('')}</ol><div class="acts"><button class="btn pri" data-x>Empezar</button></div>`);
 $$('[data-t]').forEach(li=>li.onclick=()=>{const t=TOUR[+li.dataset.t];closeM();if(ROLE!==t[0])setRole(t[0],true);location.hash='#'+t[1];toast(t[3])})}
$('#tourBtn').onclick=abrirTour;
setRole('admin',true);setTimeout(()=>{if(innerWidth>640)abrirTour()},400);
})();
</script>
