const TOUR=[['vecino','inicio','Inicio del vecino','Avisos del municipio, cuotas, lo que tiene hoy, turnos y reclamos abiertos.'],['vecino','actividades','Actividades con cupo','Se inscribe a sí mismo o a su familia. Si no hay lugar, queda en lista de espera.'],['vecino','reclamos','Hacer un reclamo','Elige qué pasa, la dirección, ubicación y foto. Llega solo al área que corresponde.'],['vecino','turnos','Sacar un turno','Servicio, día y horario libre. Puede cancelar y el horario se libera.'],['agente','resumen','Resumen de gestión','Lo pendiente de cada área: reclamos, inscripciones, pagos y turnos.'],['agente','grec','Bandeja de reclamos','Filtra por estado y categoría, toma el reclamo y le responde al vecino.'],['admin','usuarios','Roles y áreas','Los vecinos se registran solos; acá se asigna quién es personal y de qué área.']];

 $('#mX').onclick=closeM;$$('[data-t]').forEach(li=>li.onclick=()=>{const t=TOUR[+li.dataset.t];closeM();if(ROLE!==t[0])setRole(t[0],true);location.hash='#'+t[1];toast(t[3])})}
