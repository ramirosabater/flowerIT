(function(){
/* =====================================================================

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const NOW=new Date();NOW.setHours(12,0,0,0);const TODAY=iso(NOW);const PER=TODAY.slice(0,7);
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const fd=s=>s?s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4):'—';

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const perLbl=p=>MESES[+p.slice(5,7)-1]+' '+p.slice(0,4);
const prevPer=(p,k)=>{const d=new Date(p+'-15T12:00:00');d.setMonth(d.getMonth()-k);return iso(d).slice(0,7)};

const RANGOS=['Cinta blanca','Cinta amarilla','Cinta naranja','Cinta verde','Cinta azul','Cinta roja','Cinta marrón','Cinta negra','Instructor'];
const RECINTOS=['Sede Centro','Club Náutico','Gimnasio Municipal Norte'];
const MEDIOS=['Transferencia','Efectivo','Mercado Pago'];

const DIR={id:'d1',n:'Gabriela Ruiz'};
let CLASES=[
 {id:'c1',n:'Infantiles',dias:[2,4],h:'18:00',prof:'p1',rec:'Sede Centro',cuota:18000,esp:false,c:'#3FA66A'},
 {id:'c2',n:'Adultos',dias:[1,3,5],h:'19:30',prof:'p2',rec:'Sede Centro',cuota:22000,esp:false,c:'#4C8DF6'},
 {id:'c3',n:'Avanzados',dias:[6],h:'10:00',prof:'p2',rec:'Sede Centro',cuota:15000,esp:true,c:'#E4141B'},
 {id:'c4',n:'Armas',dias:[3],h:'21:00',prof:'p3',rec:'Sede Centro',cuota:12000,esp:true,c:'#D6A43C'},
 {id:'c5',n:'Acrobacia',dias:[5],h:'18:00',prof:'p3',rec:'Club Náutico',cuota:14000,esp:false,c:'#B06CF0'},
 {id:'c6',n:'Mañanas Norte',dias:[2,4],h:'09:00',prof:'p1',rec:'Gimnasio Municipal Norte',cuota:16000,esp:false,c:'#2BB3B3'}];
const NOMBRES=['Valentina','Mateo','Sofía','Benjamín','Martina','Thiago','Catalina','Joaquín','Emma','Lautaro','Olivia','Bautista','Julieta','Felipe','Mía','Santino','Lucía','Tomás','Camila','Nicolás','Agustina','Facundo','Abril','Ignacio','Florencia','Gonzalo','Paula','Ramiro','Carla','Esteban','Micaela','Hernán'];

let ALUMNOS=NOMBRES.map((n,i)=>{const kid=i<9;const age=kid?6+Math.floor(R()*7):16+Math.floor(R()*35);let nac=new Date(NOW.getFullYear()-age,Math.floor(R()*12),1+Math.floor(R()*27));
 if(i===4||i===17){nac=new Date(NOW.getFullYear()-age,NOW.getMonth(),NOW.getDate())}
 if(i===11){nac=new Date(NOW.getFullYear()-age,NOW.getMonth(),Math.min(27,NOW.getDate()+2))}
 const rec=i<24?'Sede Centro':i<28?'Club Náutico':'Gimnasio Municipal Norte';
 return {id:'a'+(i+1),n:n+' '+APES[i],u:(n[0]+APES[i]).toLowerCase().normalize('NFD').replace(/[^a-z]/g,''),nac:iso(nac),rango:RANGOS[kid?Math.floor(R()*3):Math.min(8,Math.floor(R()*8))],rec,tel:'(0297) 15-555-'+String(1000+Math.floor(R()*8999)),c1:(kid?'Mamá: ':'')+pick(['Laura','Pablo','Silvia','Jorge','Mónica','Daniel'])+' · (0297) 15-555-'+String(1000+Math.floor(R()*8999)),salud:pick(['','','','Asma leve: trae inhalador','Lesión de rodilla (2025): evitar saltos','Alergia a la penicilina','']),activo:i!==31,alta:addD(TODAY,-Math.floor(60+R()*900))}});
const age=nac=>{const n=new Date(nac+'T12:00:00');let e=NOW.getFullYear()-n.getFullYear();const m=NOW.getMonth()-n.getMonth();if(m<0||(m===0&&NOW.getDate()<n.getDate()))e--;return e};
const cumpleEn=(nac,f)=>nac&&f&&nac.slice(5)===f.slice(5);
let INSC=[];ALUMNOS.forEach((a,i)=>{if(a.rec==='Club Náutico'){INSC.push(['c5',a.id]);if(i%2)INSC.push(['c2',a.id])}else if(a.rec==='Gimnasio Municipal Norte'){INSC.push(['c6',a.id])}else if(i<9){INSC.push(['c1',a.id])}else{INSC.push(['c2',a.id]);if(R()<.45)INSC.push(['c3',a.id]);if(R()<.3)INSC.push(['c4',a.id])}});

let PAGOS=[];let np=1;(function(){[2,1,0].forEach(k=>{const p=prevPer(PER,k);ALUMNOS.filter(a=>a.activo).forEach((a,i)=>{const esp=esperadoDe(a.id);if(!esp)return;const deudor=k===0&&[7,13,21,26].includes(i),pend=k===0&&[3,10,19,29].includes(i),parcial=k===0&&i===15;if(deudor)return;if(k===0&&NOW.getDate()<=10&&R()<.25&&!pend)return;
 const dia=Math.min(28,1+Math.floor(R()*12));const fe=p+'-'+pad(dia);PAGOS.push({id:'pg'+np++,a:a.id,per:p,monto:parcial?Math.round(esp/2):esp,medio:pick(MEDIOS),fecha:fe>TODAY?TODAY:fe,estado:pend?'pendiente':'aprobado',comp:pick(MEDIOS)!=='Efectivo',nota:''})})})})();

function vCalendario(){const [y,m]=calM.split('-').map(Number);const first=new Date(y,m-1,1);const lead=(first.getDay()+6)%7;const days=new Date(y,m,0).getDate();let cells='';for(let i=0;i<lead;i++)cells+='<div class="d off"></div>';

 <div class="card" style="margin-bottom:14px"><h2>Registrar un pago</h2><div class="form"><label class="f">Período<select id="mP">${[0,1].map(k=>`<option value="${prevPer(PER,k)}">${perLbl(prevPer(PER,k))}</option>`).join('')}</select></label><label class="f">Monto<input id="mM" inputmode="numeric" value="${esp}"></label><label class="f">Medio<select id="mMe">${MEDIOS.map(m=>`<option>${m}</option>`).join('')}</select></label></div>
 <div class="bar" style="margin:12px 0 0"><button class="btn" id="mC">📎 Adjuntar comprobante</button><span class="small muted" id="mCn">Sin comprobante</span><span style="flex:1"></span><button class="btn pri" id="mGo">Registrar pago</button></div></div>
 <div class="card"><h2>Mis pagos</h2><div class="tw"><table><thead><tr><th>Fecha</th><th>Período</th><th>Medio</th><th class="num">Monto</th><th>Estado</th></tr></thead><tbody>${L.map(p=>`<tr><td>${fd(p.fecha)}</td><td style="text-transform:capitalize">${perLbl(p.per)}</td><td>${p.medio}</td><td class="num">${money(p.monto)}</td><td><span class="pill ${p.estado==='aprobado'?'ok':p.estado==='pendiente'?'warn':'bad'}">${p.estado==='aprobado'?'Aprobado':p.estado==='pendiente'?'En revisión':'Rechazado'}</span>${p.nota?`<div class="small muted">${esc(p.nota)}</div>`:''}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Todavía no registraste pagos.</td></tr>'}</tbody></table></div></div>`}
function vMisInformes(){const esp=clasesDe(ME_ALUMNO).filter(c=>c.esp);const L=INFORMES.filter(i=>i.a===ME_ALUMNO);
 return `<h1>Mis informes</h1><p class="sub">Después de cada clase especial contá qué trabajaste. Solo lo ven vos y tus profesores.</p>
 ${esp.length?`<div class="card" style="margin-bottom:14px"><h2>Nuevo informe</h2><div class="form" style="grid-template-columns:1fr 1fr"><label class="f">Clase<select id="nC">${esp.map(c=>`<option value="${c.id}">${esc(c.n)}</option>`).join('')}</select></label><label class="f">Fecha de la clase<input type="date" id="nF" value="${TODAY}" max="${TODAY}"></label></div><label class="f" style="margin-top:12px">Qué trabajaste<textarea id="nT" placeholder="Formas, técnicas, qué te costó, qué te marcó el profe…"></textarea></label><div class="bar" style="margin:12px 0 0;justify-content:flex-end"><button class="btn pri" id="nGo">Enviar informe</button></div></div>`:'<div class="aviso warn">No estás inscripto en ninguna clase especial.</div>'}
 <h2>Mis informes enviados</h2>${L.map(i=>`<div class="inf"><div class="h"><b>${esc(cla(i.c).n)} <span class="small muted">· ${fd(i.fecha)}</span></b>${i.leido?'<span class="pill ok">Leído por el profe</span>':'<span class="pill">Sin leer</span>'}</div><p>${esc(i.txt)}</p></div>`).join('')||'<p class="muted">Todavía no enviaste informes.</p>'}`}
function vMiAsistencia(){const L=[];Object.entries(ASIS).forEach(([k,pres])=>{if(ME_ALUMNO in pres){const [cid,f]=k.split('|');L.push({c:cla(cid),f,p:pres[ME_ALUMNO]})}});L.sort((a,b)=>b.f.localeCompare(a.f));const p=L.filter(x=>x.p).length;
 return `<h1>Mi asistencia</h1><p class="sub">Tus clases de las últimas semanas.</p>
 <div class="grid g4" style="margin-bottom:14px"><div class="card stat ok"><div class="stat-num">${L.length?Math.round(p/L.length*100):0}%</div><div class="stat-lbl">presentismo</div></div><div class="card stat"><div class="stat-num">${p}</div><div class="stat-lbl">clases con presente</div></div><div class="card stat red"><div class="stat-num">${L.length-p}</div><div class="stat-lbl">ausencias</div></div><div class="card stat"><div class="stat-num" style="font-size:20px">${esc(alu(ME_ALUMNO).rango)}</div><div class="stat-lbl">tu rango</div></div></div>
 <div class="card"><div class="tw"><table><thead><tr><th>Fecha</th><th>Clase</th><th>Asistencia</th></tr></thead><tbody>${L.map(x=>`<tr><td>${DIAS[new Date(x.f+'T12:00:00').getDay()]} ${fd(x.f)}</td><td>${esc(x.c.n)}</td><td>${x.p?'<span class="pill ok">Presente</span>':'<span class="pill bad">Ausente</span>'}</td></tr>`).join('')}</tbody></table></div></div>`}
const VIEWS={calendario:vCalendario,asistencia:vAsistencia,reportes:vReportes,informes:vInformes,pagos:vPagos,clases:vClases,cobranzas:vCobranzas,usuarios:vUsuarios,mispagos:vMisPagos,misinformes:vMisInformes,miasistencia:vMiAsistencia};

/* ---------- modales ---------- */
function modal(html){$('#modal').innerHTML=html;$('#ov').classList.add('show');const f=$('#modal').querySelector('input,select,textarea,button');if(f)f.focus()}
function closeModal(){$('#ov').classList.remove('show')}
$('#ov').addEventListener('mousedown',e=>{if(e.target.id==='ov')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function compHTML(p){const a=alu(p.a);return `<div class="comp"><b>${p.medio==='Mercado Pago'?'Comprobante de pago':'Comprobante de transferencia'}</b><br>Fecha: ${fd(p.fecha)}<br>De: ${esc(a.n.toUpperCase())}<br>Para: ACADEMIA OCHO VIENTOS (cuenta ficticia)<br>Concepto: Cuota ${perLbl(p.per)}<br><b>Importe: ${money(p.monto)}</b><br>Operación Nº ${String(70000000+parseInt(p.id.slice(2))*7919).slice(0,8)}</div><p class="small muted">Comprobante de ejemplo con datos ficticios.</p>`}
function usuarioModal(a){const nuevo=!a;a=a||{n:'',u:'',nac:addD(TODAY,-365*20),rango:RANGOS[0],rec:RECINTOS[0],tel:'',c1:'',salud:'',activo:true};
 modal(`<h3>${nuevo?'Nuevo usuario':'Editar usuario'}</h3><p class="small muted" style="margin:0 0 12px">${nuevo?'El alumno ingresa con ese usuario y esa contraseña. No hace falta email.':'Alta: '+fd(a.alta)}</p>
 <div class="form" style="grid-template-columns:1fr 1fr"><label class="f">Nombre y apellido<input id="eN" value="${esc(a.n)}"></label><label class="f">Usuario<input id="eU" value="${esc(a.u)}" placeholder="ej: juan.perez"></label>
 ${nuevo?'<label class="f">Contraseña<input id="eP" type="password" placeholder="mínimo 6 caracteres"></label>':''}<label class="f">Fecha de nacimiento<input id="eNac" type="date" value="${a.nac}"></label><label class="f">Rango<select id="eR">${RANGOS.map(r=>`<option ${r===a.rango?'selected':''}>${r}</option>`).join('')}</select></label><label class="f">Recinto<select id="eRec">${RECINTOS.map(r=>`<option ${r===a.rec?'selected':''}>${r}</option>`).join('')}</select></label>
 <label class="f">Teléfono<input id="eT" value="${esc(a.tel)}"></label><label class="f">Contacto 1<input id="eC" value="${esc(a.c1)}"></label></div>
 <label class="f" style="margin-top:12px">Salud<input id="eS" value="${esc(a.salud)}" placeholder="Alergias, lesiones, condiciones a tener en cuenta…"></label>
 ${nuevo?'':`<label class="f" style="margin-top:12px;flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="eA" ${a.activo?'checked':''} style="width:18px;height:18px;accent-color:var(--red)"> Activo</label>`}
 <div class="acts"><button class="btn" id="mX">Cancelar</button><button class="btn pri" id="mOk">${nuevo?'Crear usuario':'Guardar cambios'}</button></div>`);
 $('#mX').onclick=closeModal;$('#mOk').onclick=()=>{const n=$('#eN').value.trim(),u=$('#eU').value.trim().toLowerCase();if(!n||!/^[a-z0-9._-]{3,}$/.test(u))return toast('Completá el nombre y un usuario válido.');if(ALUMNOS.some(x=>x.u===u&&x!==a&&(nuevo||x.id!==a.id)))return toast('Ese usuario ya existe. Elegí otro.');if(nuevo&&($('#eP').value||'').length<6)return toast('La contraseña necesita al menos 6 caracteres.');
  const v={n,u,nac:$('#eNac').value,rango:$('#eR').value,rec:$('#eRec').value,tel:$('#eT').value.trim(),c1:$('#eC').value.trim(),salud:$('#eS').value.trim()};
  if(nuevo){ALUMNOS.push(Object.assign({id:'a'+(ALUMNOS.length+1),activo:true,alta:TODAY},v));toast('Usuario creado. Ya puede entrar.')}else{Object.assign(a,v,{activo:$('#eA').checked});toast('Usuario actualizado.')}closeModal();route()}}
function claseModal(){modal(`<h3>Nueva clase</h3><div class="form" style="grid-template-columns:1fr 1fr;margin-top:10px"><label class="f">Nombre<input id="kN" placeholder="Ej: Juveniles"></label><label class="f">Horario<input id="kH" type="time" value="19:00"></label><label class="f">Profesor<select id="kP"><option value="">Sin asignar</option>${PROFES.map(p=>`<option value="${p.id}">${esc(p.n)}</option>`).join('')}</select></label><label class="f">Recinto<select id="kR">${RECINTOS.map(r=>`<option>${r}</option>`).join('')}</select></label><label class="f">Cuota<input id="kC" inputmode="numeric" placeholder="0"></label><label class="f" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);padding-top:22px"><input type="checkbox" id="kE" style="width:18px;height:18px;accent-color:var(--red)"> Especial (pide informe)</label></div>
 <div class="f" style="margin-top:12px;font-size:13px;color:var(--muted);font-weight:600">Días de clase</div><div class="bar" style="margin-top:6px">${[1,2,3,4,5,6].map(d=>`<label style="display:flex;gap:5px;align-items:center"><input type="checkbox" class="kD" value="${d}" style="accent-color:var(--red)">${DC[d]}</label>`).join('')}</div>
 <div class="acts"><button class="btn" id="mX">Cancelar</button><button class="btn pri" id="mOk">Crear clase</button></div>`);
 $('#mX').onclick=closeModal;$('#mOk').onclick=()=>{const n=$('#kN').value.trim();const dias=[...document.querySelectorAll('.kD:checked')].map(x=>+x.value);if(!n||!dias.length)return toast('Completá el nombre y al menos un día.');CLASES.push({id:'c'+(CLASES.length+1),n,dias,h:$('#kH').value||'19:00',prof:$('#kP').value,rec:$('#kR').value,cuota:+$('#kC').value.replace(/\D/g,'')||0,esp:$('#kE').checked,c:['#F06C9B','#7FB800','#FF9F1C'][CLASES.length%3]});closeModal();toast('Clase creada. Ya aparece en el calendario.');route()}}

/* ---------- router ---------- */
function route(){const v=(location.hash.slice(1)||NAV[ROLE][0][0]).split('/')[0];const ok=NAV[ROLE].some(n=>n[0]===v)?v:NAV[ROLE][0][0];
 $('#tabs').innerHTML=NAV[ROLE].map(([k,l])=>`<a class="tab ${k===ok?'on':''}" href="#${k}">${l}</a>`).join('');
 $('#main').innerHTML=VIEWS[ok]()+'<p class="proto">Demo con datos ficticios: alumnos, profesores, recintos, teléfonos y pagos son inventados. Los cambios se ven al instante pero se pierden al recargar.</p>';wire(ok);window.scrollTo(0,0)}
function wire(v){const keep=()=>{const y=scrollY;route();scrollTo(0,y)};
 document.querySelectorAll('[data-cm]').forEach(b=>b.onclick=()=>{const k=+b.dataset.cm;if(!k)calM=PER;else{const d=new Date(calM+'-15T12:00:00');d.setMonth(d.getMonth()+k);calM=iso(d).slice(0,7)}keep()});
 if(v==='asistencia'){$('#aC').onchange=e=>{asisC=e.target.value;keep()};$('#aF').onchange=e=>{asisF=e.target.value||TODAY;keep()};const cnt=()=>{const n=document.querySelectorAll('.ach:checked').length,t=document.querySelectorAll('.ach').length;const c=$('#aCnt');if(c)c.textContent=n+' de '+t+' presentes'};cnt();document.querySelectorAll('.ach').forEach(c=>c.onchange=cnt);
  const g=$('#aGo');if(g)g.onclick=()=>{const pres={};document.querySelectorAll('.ach').forEach(c=>pres[c.dataset.a]=c.checked);ASIS[asisC+'|'+asisF]=pres;toast('Asistencia guardada.')}}
 if(v==='reportes'){$('#rC').onchange=e=>{repC=e.target.value;keep()};$('#rD').onchange=e=>{repD=e.target.value||repD;keep()}}
 document.querySelectorAll('[data-leer]').forEach(b=>b.onclick=()=>{INFORMES.find(i=>i.id===b.dataset.leer).leido=true;toast('Marcado como leído. El alumno lo ve.');keep()});
 if(v==='pagos'){$('#pF').onchange=e=>{pagF=e.target.value;keep()}}
 document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>{const p=PAGOS.find(x=>x.id===b.dataset.comp);modal(`<h3>Comprobante · ${esc(alu(p.a).n)}</h3>${compHTML(p)}<div class="acts"><button class="btn" id="mX">Cerrar</button></div>`);$('#mX').onclick=closeModal});
 document.querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>{PAGOS.find(x=>x.id===b.dataset.ap).estado='aprobado';toast('Pago aprobado. Ya cuenta en cobranzas.');keep()});
 document.querySelectorAll('[data-re]').forEach(b=>b.onclick=()=>{const p=PAGOS.find(x=>x.id===b.dataset.re);modal(`<h3>Rechazar pago</h3><p class="small muted">${esc(alu(p.a).n)} · ${money(p.monto)}. El alumno ve el motivo.</p><label class="f">Motivo<input id="rM" placeholder="Ej: el comprobante no se lee"></label><div class="acts"><button class="btn" id="mX">Cancelar</button><button class="btn pri" id="mOk">Rechazar</button></div>`);$('#mX').onclick=closeModal;$('#mOk').onclick=()=>{p.estado='rechazado';p.nota=$('#rM').value.trim()||'Rechazado por el profesor';closeModal();toast('Pago rechazado. El alumno ve el motivo.');keep()}});
 if(v==='clases'){document.querySelectorAll('[data-cl]').forEach(r=>r.onclick=()=>{claSel=r.dataset.cl;route();const c=$('#insC');if(c)c.scrollIntoView({block:'start'})});const n=$('#cNew');if(n)n.onclick=claseModal;
  const ig=$('#iGo');if(ig)ig.onclick=()=>{const a=$('#iA').value;if(!a)return toast('Elegí un alumno.');INSC.push([claSel,a]);toast('Inscripto. Ya cuenta en la cuota y en la asistencia.');keep()};
  document.querySelectorAll('[data-baja]').forEach(b=>b.onclick=()=>{INSC=INSC.filter(x=>!(x[0]===claSel&&x[1]===b.dataset.baja));toast('Ya no está inscripto en esta clase.');keep()})}
 if(v==='cobranzas'){$('#cR').onchange=e=>{cobRec=e.target.value;keep()};document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{const a=alu(b.dataset.wa);toast('En el sistema real se abre WhatsApp con el mensaje a '+a.n.split(' ')[0]+'. En la demo no se envía nada.')})}
 if(v==='usuarios'){const q=$('#uQ');q.oninput=e=>{usrQ=e.target.value;const p=q.selectionStart;route();const n=$('#uQ');n.focus();n.setSelectionRange(p,p)};$('#uR').onchange=e=>{usrRec=e.target.value;keep()};$('#uNew').onclick=()=>usuarioModal(null);document.querySelectorAll('[data-us]').forEach(r=>r.onclick=()=>usuarioModal(alu(r.dataset.us)))}
 if(v==='mispagos'){let comp=false;$('#mC').onclick=()=>{comp=true;$('#mCn').textContent='comprobante.jpg · listo';toast('En la demo no se sube ningún archivo.')};
  $('#mGo').onclick=()=>{const m=+$('#mM').value.replace(/\D/g,'');if(!(m>0))return toast('Completá el monto.');if($('#mMe').value!=='Efectivo'&&!comp)return toast('Adjuntá el comprobante de la transferencia.');PAGOS.push({id:'pg'+np++,a:ME_ALUMNO,per:$('#mP').value,monto:m,medio:$('#mMe').value,fecha:TODAY,estado:'pendiente',comp,nota:''});toast('Pago registrado. Queda en revisión hasta que lo apruebe un profesor.');keep()}}
 if(v==='misinformes'){const g=$('#nGo');if(g)g.onclick=()=>{const t=$('#nT').value.trim();if(t.length<15)return toast('Contá un poco más de lo que trabajaste.');INFORMES.unshift({id:'in'+(INFORMES.length+1),a:ME_ALUMNO,c:$('#nC').value,fecha:$('#nF').value||TODAY,txt:t,leido:false});toast('Informe enviado. Lo ven tus profesores.');keep()}}}
addEventListener('hashchange',route);

/* ---------- recorrido ---------- */
const TOUR=[['admin','calendario','El calendario','Todas las clases del mes en sus días y horarios, con los cumpleaños marcados.'],['admin','asistencia','Tomar asistencia','El profesor marca quién vino y ve al lado cómo está cada alumno con la cuota.'],['admin','cobranzas','Cobranzas','Lo esperado según las clases de cada alumno, lo cobrado por caja y por medio, y los deudores.'],['admin','pagos','Revisar pagos','Los alumnos suben el comprobante y acá se aprueba o se rechaza con un motivo.'],['alumno','mispagos','Lo que ve el alumno','Su cuota, el aviso si debe, y el registro del pago con comprobante.'],['alumno','misinformes','Informes de clase','Después de cada clase especial, el alumno cuenta qué trabajó. Solo lo ven él y los profes.']];
function abrirTour(){modal(`<h3>Recorrido en 2 minutos</h3><p class="small muted" style="margin:0">Sistema para una academia de artes marciales: clases, asistencia, cuotas e informes, con lo que ve cada rol. Tocá un paso para ir.</p><ol class="tour-list">${TOUR.map((t,i)=>`<li data-t="${i}"><span class="k">${i+1}</span><div><b>${t[2]}</b><span class="small muted">${t[3]}</span></div></li>`).join('')}</ol><div class="acts"><button class="btn pri" id="mX">Empezar</button></div>`);
 $('#mX').onclick=closeModal;document.querySelectorAll('[data-t]').forEach(li=>li.onclick=()=>{const t=TOUR[+li.dataset.t];closeModal();if(ROLE!==t[0])setRole(t[0]);location.hash='#'+t[1];toast(t[3])})}
$('#tourBtn').onclick=abrirTour;
setRole('admin');setTimeout(()=>{if(innerWidth>640)abrirTour()},400);
})();
</script>
</body>
</html>
