<style>
:root{
  --petrol:#0E5C63; --petrol-dark:#0A4247; --petrol-light:#12777F;
  --ink:#12211F; --mist:#F6F8F8;
  --ink80:rgba(18,33,31,.8); --ink70:rgba(18,33,31,.7); --ink60:rgba(18,33,31,.6); --ink50:rgba(18,33,31,.5); --ink40:rgba(18,33,31,.4); --ink30:rgba(18,33,31,.3); --ink25:rgba(18,33,31,.25);

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--mist);color:var(--ink)}

.cap{text-transform:capitalize}
.muted{color:var(--ink50)}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Franja demo */
.demo-strip{position:fixed;top:0;left:0;right:0;height:var(--strip);z-index:300;display:flex;align-items:center;justify-content:center;gap:14px;padding:0 12px;background:#0A2A2E;color:#fff;font-size:13px;font-weight:600}

.demo-strip .cta{flex:none;background:#fff;color:var(--petrol);padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:700}
.demo-strip .tour{flex:none;color:#fff;opacity:.85;border:1px solid rgba(255,255,255,.35);padding:4px 10px;border-radius:999px;font-size:12px}

/* Header app */
header.app{position:sticky;top:var(--strip);z-index:20;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px)}

nav.main a{padding:6px 11px;border-radius:6px;color:var(--ink70);white-space:nowrap}

.user{display:flex;align-items:center;gap:10px;flex:none}

.btn:hover{background:var(--petrol-dark)}

/* Calendario */
.cal{overflow-x:auto}

/* Listas */
.list{list-style:none;background:#fff;border:1px solid var(--line);border-radius:12px}

td{padding:8px 0;border-top:1px solid var(--line)}
.r{text-align:right}

/* Ficha */
.datos{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

textarea.inp{width:100%;padding:8px 12px;border-radius:8px;resize:vertical}
.reg{padding:16px}

.est .th.img{background:linear-gradient(135deg,#1f2937,#4b5563);color:#e5e7eb;font-size:12px;letter-spacing:.08em}

/* Pantallas completas (kiosco / sala / reserva) */
.full{position:fixed;inset:var(--strip) 0 0 0;z-index:40;display:flex;flex-direction:column;background:var(--petrol);color:#fff;overflow:auto}

.kio{width:100%;max-width:420px;text-align:center}

.kio .disp{margin-top:28px;height:76px;border-radius:16px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;letter-spacing:.12em}
.keys{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.keys button{height:72px;border-radius:16px;font-size:28px;font-weight:600;background:rgba(255,255,255,.1);color:#fff;transition:transform .1s,background .15s}
.keys button:hover{background:rgba(255,255,255,.2)}

.hint button{display:flex;justify-content:space-between;width:100%;padding:5px 8px;border-radius:8px;color:#fff;text-align:left;gap:10px}

.res{max-width:520px;text-align:center;color:#fff}

<script>
/* =====================================================================
   DEMO_DATA — todos los datos son FICTICIOS. Editá libremente.
   Organización, sedes, profesionales, pacientes, coberturas y montos
   son inventados. Los turnos se generan alrededor de la fecha de hoy.
   ===================================================================== */
const DEMO_DATA = {
  organizacion: "Centro Médico Bahía Serena",
  usuario: { nombre: "Laura Méndez", rol: "Administración" },
  sedes: [
    { id: "centro", nombre: "Sede Centro" },
    { id: "norte",  nombre: "Sede Barrio Norte" },
  ],
  profesionales: [

/* ============================ Utilidades ============================ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = (n) => String(n).padStart(2, "0");
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = fromIso(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDays = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 86400000);
const toMin = (h) => { const [a, b] = h.split(":").map(Number); return a * 60 + b; };
const hhmm = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const fmtDni = (v) => String(v).replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ".");
const pesos = (n) => new Intl.NumberFormat("es-AR", { style: "currency", currency: "ARS", maximumFractionDigits: 0 }).format(n);
const fLarga = (s) => new Intl.DateTimeFormat("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(fromIso(s));
const fCorta = (s) => new Intl.DateTimeFormat("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" }).format(fromIso(s));
const fDM = (s) => new Intl.DateTimeFormat("es-AR", { day: "2-digit", month: "2-digit" }).format(fromIso(s));
const diaCorto = (s) => new Intl.DateTimeFormat("es-AR", { weekday: "short", day: "numeric" }).format(fromIso(s));
const wd = (s) => fromIso(s).getDay();

let seed = 20261;
const rnd = () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const pick = (a) => a[Math.floor(rnd() * a.length)];

const ESTADOS = ["RESERVADO","EN_ESPERA","EN_CONSULTA","ATENDIDO","AUSENTE","CANCELADO","PENDIENTE"];
const LABEL = { RESERVADO:"Reservado", EN_ESPERA:"En espera", EN_CONSULTA:"En consulta", ATENDIDO:"Atendido", AUSENTE:"Ausente", CANCELADO:"Cancelado", PENDIENTE:"Pendiente" };

};

/* ======================= Generación de datos ======================= */
const D = DEMO_DATA;
const HOY = iso(new Date());
const realMin = new Date().getHours() * 60 + new Date().getMinutes();
const NOW_MIN = Math.min(Math.max(realMin, 10 * 60 + 10), 11 * 60 + 20); // "reloj" de la demo para repartir estados de hoy

const sedeById = Object.fromEntries(D.sedes.map((s) => [s.id, s]));
const profById = Object.fromEntries(D.profesionales.map((p) => [p.id, p]));
const pracById = Object.fromEntries(D.practicas.map((p) => [p.id, p]));
const profLabel = (id) => { const p = profById[id]; return `${p.prefijo} ${p.apellido}, ${p.nombre}`; };
const profCorto = (id) => { const p = profById[id]; return `${p.prefijo} ${p.apellido}`; };
const pracLabel = (id) => { const p = pracById[id]; return `${profById[p.prof].especialidad} · ${p.nombre}`; };

function horariosDe(prof, sede, fecha) {
  let dia = wd(fecha);
  if (fecha === HOY && (dia === 0 || dia === 6)) dia = 3; // la demo siempre tiene agenda "hoy"
  return D.horarios.filter((h) => (!prof || h.prof === prof) && (!sede || h.sede === sede) && h.dias.includes(dia));
}

const S = {
  pacientes: [], turnos: [], hce: [], recetas: [], estudios: [], nextId: 1,

  modal: null, flash: null,

(function generar() {
  const usados = new Set();
  for (let i = 0; i < 52; i++) {
    let nombre, apellido;
    do { nombre = pick(D.nombres); apellido = pick(D.apellidos); } while (usados.has(nombre + apellido));
    usados.add(nombre + apellido);
    const cob = rnd() < .18 ? "Particular" : pick(D.coberturas.slice(0, 5));
    const nac = `${1950 + Math.floor(rnd() * 70)}-${pad(1 + Math.floor(rnd() * 12))}-${pad(1 + Math.floor(rnd() * 28))}`;
    S.pacientes.push({
      id: "pa" + i, nombre, apellido,
      dni: String(20000000 + Math.floor(rnd() * 25000000)),
      tel: `297 555-${pad(Math.floor(rnd() * 100))}${pad(Math.floor(rnd() * 100))}`,
      email: `${nombre}.${apellido}`.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "") + "@ejemplo.com",
      cob, afiliado: cob === "Particular" ? "" : String(60000000000 + Math.floor(rnd() * 9999999999)),
      nac, sexo: rnd() < .55 ? "F" : "M",
      creado: i < 7 ? addDays(HOY, -Math.floor(rnd() * 20)) : addDays(HOY, -30 - Math.floor(rnd() * 500)),
    });
  }
  for (let off = -62; off <= 24; off++) {
    const fecha = addDays(HOY, off);
    for (const h of horariosDe(null, null, fecha)) {
      const fill = off < 0 ? .72 : off === 0 ? .85 : Math.max(.18, .8 - off * .028);
      for (let m = toMin(h.desde); m + h.dur <= toMin(h.hasta); m += h.dur) {
        if (rnd() > fill) continue;
        const pracs = D.practicas.filter((p) => p.prof === h.prof);
        const prac = (pracs.length > 1 && rnd() < .2) ? pracs[1] : pracs[0];
        const pac = pick(S.pacientes);
        let estado = "RESERVADO", llamado = null;
        if (off < 0) {
          const r = rnd(); estado = r < .8 ? "ATENDIDO" : r < .89 ? "AUSENTE" : "CANCELADO";
        } else if (off === 0) {
          if (m + h.dur <= NOW_MIN) { const r = rnd(); estado = r < .86 ? "ATENDIDO" : r < .95 ? "AUSENTE" : "CANCELADO"; }
          else if (m <= NOW_MIN) { estado = "EN_CONSULTA"; llamado = Date.now() - (NOW_MIN - m) * 60000; }
          else if (m <= NOW_MIN + 60 && rnd() < .8) estado = "EN_ESPERA";
          else estado = rnd() < .07 ? "CANCELADO" : "RESERVADO";
        } else if (rnd() < .06) estado = "CANCELADO";
        S.turnos.push({
          id: "t" + S.nextId++, fecha, min: m, dur: h.dur, pac: pac.id, prof: h.prof, sede: h.sede, prac: prac.id,
          cob: pac.cob, estado, canal: prac.video ? "VIDEO" : "PRESENCIAL",
          conf: off < 0 ? rnd() < .6 : rnd() < .55, llamado,
        });
      }
    }
  }
  // Que cada profesional que atiende ahora tenga a alguien "En consulta" (para la pantalla de sala).
  for (const pr of D.profesionales) {
    const hoy = S.turnos.filter((t) => t.fecha === HOY && t.prof === pr.id);
    if (!hoy.length || hoy.some((t) => t.estado === "EN_CONSULTA")) continue;
    const ult = hoy.filter((t) => t.estado === "ATENDIDO" && t.min + t.dur >= NOW_MIN - 40).pop();
    if (ult) { ult.estado = "EN_CONSULTA"; ult.llamado = Date.now() - (NOW_MIN - ult.min) * 60000; }
  }
  // Historia clínica, recetas y estudios a partir de turnos atendidos.
  const porPac = {};
  for (const t of S.turnos) if (t.estado === "ATENDIDO") (porPac[t.pac] ||= []).push(t);
  for (const [pid, ts] of Object.entries(porPac)) {
    ts.sort((a, b) => (b.fecha + hhmm(b.min)).localeCompare(a.fecha + hhmm(a.min)));
    ts.slice(0, 3).forEach((t, i) => {
      S.hce.push({ id: "h" + S.nextId++, pac: pid, prof: t.prof, fecha: t.fecha, texto: pick(D.hce[t.prof]), priv: rnd() < .12,
        adj: i === 0 && rnd() < .3 ? pick(D.estudios)[0] : null });
    });
    if (rnd() < .45) S.recetas.push({ id: "r" + S.nextId++, pac: pid, prof: ts[0].prof, fecha: ts[0].fecha, texto: pick(D.recetas) });
    if (rnd() < .35) { const e = pick(D.estudios); S.estudios.push({ id: "e" + S.nextId++, pac: pid, nombre: e[0], tipo: e[1], fecha: ts[ts.length - 1].fecha }); }
  }
  const def = defaultsRango();
  S.panel = { ...def, sede: "", prof: "" };
  S.rep = { ...def, sede: "", prof: "" };
})();

function defaultsRango() { return { desde: addDays(HOY, -29), hasta: HOY }; }
function rangoMes() { return { desde: HOY.slice(0, 8) + "01", hasta: HOY }; }
const pac = (id) => S.pacientes.find((p) => p.id === id);
const pacNom = (p) => `${p.apellido}, ${p.nombre}`;
const turnosHoy = () => S.turnos.filter((t) => t.fecha === HOY).sort((a, b) => a.min - b.min);
const ordenar = (a, b) => (a.fecha === b.fecha ? a.min - b.min : a.fecha.localeCompare(b.fecha));

function go(h) { if (location.hash === "#/" + h) render(); else location.hash = "/" + h; }
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });

function render() {

  else {

    const navR = r === "paciente" ? "pacientes" : r;
    const links = [["panel","Panel"],["calendario","Calendario"],["agenda","Agenda"],["pacientes","Pacientes"],["reportes","Reportes"],["kiosco","Kiosco"],["recordatorios","Recordatorios"],["reservar","Reserva online ↗"]];

}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.remove("hide"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hide"), 2800); }

function transicion(id, nuevo) {

  toast(`${pacNom(pac(t.pac))} → ${LABEL[nuevo]}${extra}`);
}

/* ============================ Calendario ============================ */
function semanaDias(off) {
  const d = fromIso(HOY); const w = d.getDay(); const lunes = addDays(HOY, -(w === 0 ? 6 : w - 1) + off * 7);
  return Array.from({ length: 7 }, (_, i) => addDays(lunes, i));
}
function pCalendario() {
  const c = S.cal; const dias = semanaDias(c.semana);
  const ts = S.turnos.filter((t) => t.fecha >= dias[0] && t.fecha <= dias[6] && (!c.sede || t.sede === c.sede) && (!c.prof || t.prof === c.prof) && (c.canc || t.estado !== "CANCELADO")).sort(ordenar);
  return `
  <div class="between mb4"><h1>Calendario</h1>
    <div class="row" style="gap:4px"><button class="btn ghost sm" data-a="calSem" data-v="-1">‹</button><button class="btn ghost sm" data-a="calSem" data-v="0">Hoy</button><button class="btn ghost sm" data-a="calSem" data-v="1">›</button></div></div>

    <label class="row" style="font-size:14px;gap:8px"><span class="muted">Profesional</span><select class="inp" data-c="calProf"><option value="">Todos</option>${D.profesionales.map((p) => `<option value="${p.id}" ${c.prof === p.id ? "selected" : ""}>${p.apellido}, ${p.nombre}</option>`).join("")}</select></label>

  </div>
  <div class="cal"><div class="wk">${dias.map((d) => {
    const del = ts.filter((t) => t.fecha === d);

        return `<li><button class="t blk e-${t.estado} ${t.estado === "CANCELADO" ? "canc" : ""}" data-a="verTurno" data-v="${t.id}"><div><span class="d"></span><span class="tnum" style="font-weight:500;color:var(--ink80)">${hhmm(t.min)}</span></div><div class="trunc nm" style="color:var(--ink80)">${esc(pacNom(p))}</div><div class="trunc x">${profById[t.prof].apellido}</div></button></li>`; }).join("")}</ul></div>`;
  }).join("")}</div></div>`;
}

/* ========================== Panel / Reportes ========================== */
function stats(f) {
  const inR = (t, a, b) => t.fecha >= a && t.fecha <= b && (!f.sede || t.sede === f.sede) && (!f.prof || t.prof === f.prof);
  const dias = Math.max(1, diffDays(f.desde, f.hasta) + 1);
  const pDesde = addDays(f.desde, -dias), pHasta = addDays(f.desde, -1);
  const ts = S.turnos.filter((t) => inR(t, f.desde, f.hasta));
  const pv = S.turnos.filter((t) => inR(t, pDesde, pHasta));
  const n = (arr, e) => arr.filter((t) => t.estado === e).length;
  const precio = (t) => pracById[t.prac].precio;
  const at = ts.filter((t) => t.estado === "ATENDIDO");
  const ingresos = at.reduce((a, t) => a + precio(t), 0);
  const prevIng = pv.filter((t) => t.estado === "ATENDIDO").reduce((a, t) => a + precio(t), 0);
  const noCanc = ts.filter((t) => t.estado !== "CANCELADO");
  const atendidos = at.length, aus = n(ts, "AUSENTE"), canc = n(ts, "CANCELADO");
  const delta = (c, p) => (p > 0 ? Math.round(((c - p) / p) * 100) : null);
  const grupo = (arr, key, val = () => 1) => { const m = {}; for (const t of arr) m[key(t)] = (m[key(t)] || 0) + val(t); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
  const dayList = Array.from({ length: Math.min(dias, 62) }, (_, i) => addDays(f.desde, i));
  return {
    dias, total: ts.length, atendidos, aus, canc, reservados: n(ts, "RESERVADO"),
    pacAt: new Set(at.map((t) => t.pac)).size,
    ingresos, proyectado: ts.filter((t) => t.estado === "RESERVADO").reduce((a, t) => a + precio(t), 0),
    ticket: atendidos ? Math.round(ingresos / atendidos) : 0, promDia: Math.round((ts.length / dias) * 10) / 10,
    pctCanc: ts.length ? Math.round((canc / ts.length) * 100) : null,
    pctAus: atendidos + aus ? Math.round((aus / (atendidos + aus)) * 100) : null,
    pctConf: noCanc.length ? Math.round((noCanc.filter((t) => t.conf).length / noCanc.length) * 100) : null,
    nuevos: S.pacientes.filter((p) => p.creado >= f.desde && p.creado <= f.hasta).length,
    video: ts.filter((t) => t.canal === "VIDEO").length,
    dTurnos: delta(ts.length, pv.length), dAt: delta(atendidos, n(pv, "ATENDIDO")), dIng: delta(ingresos, prevIng), dCanc: delta(canc, n(pv, "CANCELADO")),
    prev: { total: pv.length, at: n(pv, "ATENDIDO"), canc: n(pv, "CANCELADO"), ing: prevIng },
    porEstado: ESTADOS.map((e) => [e, n(ts, e)]).filter((x) => x[1] > 0),
    porCob: grupo(ts, (t) => t.cob), ingCob: grupo(at, (t) => t.cob, precio),
    ingProf: grupo(at, (t) => t.prof, precio).map(([id, v]) => [id, v, at.filter((t) => t.prof === id).length]),
    porProf: grupo(ts, (t) => t.prof),
    top: grupo(ts, (t) => t.pac).slice(0, 5),
    actividad: dayList.map((d) => [d, ts.filter((t) => t.fecha === d).length]),
  };
}
const dl = (v) => (v === null || v === undefined ? "" : `<span class="delta ${v >= 0 ? "up" : "down"}">${v >= 0 ? "▲" : "▼"} ${Math.abs(v)}%</span>`);
const kpi = (l, v, c = "", d, big) => `<div class="card kpi ${big ? "big" : ""}"><div class="k">${l}</div><div class="v tnum" style="${c ? "color:" + c : ""}">${v}${d !== undefined ? dl(d) : ""}</div></div>`;
const barras = (rows, max, color, fmtV, w = "130px") => rows.map(([lbl, v, extra]) => `<li class="row" style="gap:10px;flex-wrap:nowrap"><span class="trunc blbl" style="width:${w};flex:none;font-size:12.5px;color:var(--ink70)">${lbl}</span><div class="bar"><div style="width:${(v / max) * 100}%;background:${color}"></div></div>${extra !== undefined ? `<span class="bat" style="width:50px;text-align:right;font-size:12px;color:var(--ink50)">${extra} at.</span>` : ""}<span class="tnum bval" style="width:96px;text-align:right;font-size:12.5px;font-weight:500">${fmtV(v)}</span></li>`).join("");
function filtrosRango(f, key) {

    <label class="lbl"><span>Profesional</span><select class="inp" id="${key}-prof"><option value="">Todos</option>${D.profesionales.map((p) => `<option value="${p.id}" ${f.prof === p.id ? "selected" : ""}>${p.apellido}, ${p.nombre}</option>`).join("")}</select></label>
    <button class="btn dark sm" data-a="aplicar" data-v="${key}">Aplicar</button>

    ${kpi("Cancelados", s.canc, "#e11d48")}${kpi("% Cancelación", s.pctCanc === null ? "—" : s.pctCanc + "%", "#e11d48")}${kpi("% Ausentismo", s.pctAus === null ? "—" : s.pctAus + "%", "#b45309")}${kpi("% Confirmación", s.pctConf === null ? "—" : s.pctConf + "%", "#0369a1")}
    ${kpi("Pacientes nuevos", s.nuevos)}${kpi("Presenciales", s.total - s.video)}${kpi("Videoconsultas", s.video, "#0369a1")}
  </div>
  ${s.total ? `<section class="card pad mt6"><h2 class="mb3">Actividad por día</h2>
    <div style="display:flex;align-items:flex-end;gap:2px;height:112px">${s.actividad.map(([d, v]) => `<div style="flex:1" title="${fDM(d)}: ${v} turno(s)"><div style="height:${Math.max(2, (v / maxDay) * 100)}px;background:rgba(14,92,99,.7);border-radius:3px 3px 0 0"></div></div>`).join("")}</div>
    <div class="between tnum" style="font-size:10.5px;color:var(--ink40);margin-top:4px"><span>${fDM(s.actividad[0][0])}</span><span>${fDM(s.actividad[s.actividad.length - 1][0])}</span></div></section>` : ""}
  <section class="card pad mt6"><h2 class="mb3">Comparación con período anterior</h2>

    ${comp.map(([l, a, p, d, bueno]) => `<tr><td style="color:var(--ink80)">${l}</td><td class="r tnum" style="font-weight:500">${a}</td><td class="r tnum muted">${p}</td><td class="r tnum" style="font-weight:500;color:${d === null ? "var(--ink40)" : (d >= 0) === bueno ? "#059669" : "#e11d48"}">${d === null ? "—" : (d >= 0 ? "▲ " : "▼ ") + Math.abs(d) + "%"}</td></tr>`).join("")}

    <label class="lbl full2"><span>Práctica</span><select class="inp" data-c="nPrac">${D.practicas.map((p) => `<option value="${p.id}" ${m.prac === p.id ? "selected" : ""}>${pracLabel(p.id)} — ${profCorto(p.prof)} · ${pesos(p.precio)}</option>`).join("")}</select></label>
    <label class="lbl"><span>Sede</span><select class="inp" data-c="nSede">${sedes.map((id) => `<option value="${id}" ${m.sede === id ? "selected" : ""}>${sedeById[id].nombre}</option>`).join("")}</select></label>
    <label class="lbl"><span>Fecha</span><input type="date" class="inp" data-c="nFecha" min="${HOY}" value="${m.fecha}"></label>
    <div class="full2"><div class="lbl"><span>Horario</span></div>${slots.length ? `<div class="slots">${slots.map((s, i) => `<label class="slot"><input type="radio" name="nhora" value="${s}" ${i === 0 ? "checked" : ""}><span class="tnum" style="padding:6px 10px;font-size:13px">${hhmm(s)}</span></label>`).join("")}</div>`
      : `<p style="background:#fffbeb;color:#92400e;border-radius:8px;padding:8px 12px;font-size:13.5px">${profCorto(prac.prof)} no tiene horarios libres ese día en esa sede. Probá: ${proximosDias(prac.prof, m.sede).map((d) => `<button data-a="nDia" data-v="${d}" class="cap" style="color:var(--petrol);text-decoration:underline;margin-right:6px">${diaCorto(d)}</button>`).join("")}</p>`}</div>
  </div></div><div class="mf"><button class="btn ghost sm" data-a="cerrar">Cancelar</button><button class="btn sm" data-a="guardarTurno" ${slots.length ? "" : "disabled style=\"opacity:.5\""}>Guardar turno</button></div></div>`;
}
function modalWA(id) {
  const t = S.turnos.find((x) => x.id === id); const p = pac(t.pac); const m = S.modal;
  const link = `turnero.app/confirmar/${t.id}x${p.dni.slice(-4)}`;
  const msg = `Hola ${esc(p.nombre)}, le recordamos su turno el ${fCorta(t.fecha)} a las ${hhmm(t.min)} hs con ${profCorto(t.prof)} en ${sedeById[t.sede].nombre}. Para confirmar o cancelar, entrá acá: `;
  return `<div class="modal" data-stop style="max-width:440px"><div class="wa-head"><div class="av">${esc(p.nombre[0])}</div><div style="flex:1"><div style="font-weight:600">${esc(pacNom(p))}</div><div style="font-size:12px;opacity:.8">${p.tel}</div></div><button data-a="cerrar" style="color:#fff;font-size:22px">×</button></div>
    <div class="wa-body"><div class="bubble">${msg}<a data-a="waLink">${link}</a><div style="text-align:right;font-size:10.5px;color:rgba(0,0,0,.45);margin-top:4px">${hhmm(new Date().getHours() * 60 + new Date().getMinutes())} ✓✓</div></div>
      <p style="text-align:center;font-size:11.5px;color:rgba(0,0,0,.55);margin-top:10px">Demo: no se envía ningún WhatsApp. Tocá el link para ver lo que ve el paciente.</p></div>
    ${m.link ? `<div class="mb"><div class="k">Así lo ve el paciente</div><div class="phone"><div style="font-weight:600;color:var(--petrol)">${esc(D.organizacion)}</div>
      <div class="mt2" style="font-size:14px">${esc(p.nombre)}, tenés turno el <b class="cap">${fLarga(t.fecha)}</b> a las <b>${hhmm(t.min)} hs</b> con ${profCorto(t.prof)} (${profById[t.prof].especialidad}) en ${sedeById[t.sede].nombre}.</div>
      ${t.estado === "CANCELADO" ? `<div class="mt3" style="background:#ffe4e6;color:#881337;border-radius:8px;padding:10px;font-size:14px;font-weight:500">Turno cancelado. ¡Gracias por avisar!</div>`
        : t.conf ? `<div class="mt3" style="background:#d1fae5;color:#065f46;border-radius:8px;padding:10px;font-size:14px;font-weight:500">✓ ¡Turno confirmado! Te esperamos.</div>`
        : `<div class="row mt3"><button class="btn sm" data-a="pConf" data-v="${t.id}">Confirmar asistencia</button><button class="btn ghost sm" data-a="pCanc" data-v="${t.id}" style="color:#e11d48">Cancelar turno</button></div>`}</div></div>` : ""}
  </div>`;
}
function modalPac(id) {
  const p = id ? pac(id) : { nombre: "", apellido: "", dni: "", tel: "", cob: "Particular", email: "" };
  return `<div class="modal" data-stop>${mHead(id ? "Editar paciente" : "Nuevo paciente")}<div class="mb"><div class="f2">
    <label class="lbl"><span>Nombre *</span><input class="inp" id="p-nom" value="${esc(p.nombre)}"></label><label class="lbl"><span>Apellido *</span><input class="inp" id="p-ape" value="${esc(p.apellido)}"></label>
    <label class="lbl"><span>DNI *</span><input class="inp" id="p-dni" inputmode="numeric" value="${p.dni}"></label><label class="lbl"><span>Teléfono</span><input class="inp" id="p-tel" value="${esc(p.tel)}"></label>
    <label class="lbl"><span>Cobertura</span><select class="inp" id="p-cob">${D.coberturas.map((c) => `<option ${c === p.cob ? "selected" : ""}>${c}</option>`).join("")}</select></label><label class="lbl"><span>Email</span><input class="inp" id="p-mail" value="${esc(p.email)}"></label>
  </div></div><div class="mf"><button class="btn ghost sm" data-a="cerrar">Cancelar</button><button class="btn sm" data-a="guardarPac" data-v="${id || ""}">Guardar</button></div></div>`;
}

/* =============================== Acciones =============================== */
const val = (id) => ($("#" + id)?.value ?? "").trim();
const A = {
  tour() { S.modal = { t: "tour" }; renderModal(); },
  tourGo(v) { S.modal = null; go(v); renderModal(); },
  cerrar() { S.modal = null; renderModal(); },
  cerrarOv(v, e) { if (e.target.classList.contains("ov")) A.cerrar(); },
  salir() { toast("En la demo no hay sesión: ya entraste como usuario de prueba."); },
  agSede(v) { S.agenda.sede = v; render(); },
  agEstado(v) { S.agenda.estado = v; render(); },
  trans(v) { const [id, n] = v.split("|"); transicion(id, n); render(); },
  transM(v) { const [id, n] = v.split("|"); transicion(id, n); render(); },
  verTurno(v) { S.modal = { t: "turno", id: v }; renderModal(); },
  verEnAgenda(v) { S.modal = null; S.agenda = { sede: "", estado: "" }; S.resv.hecho = null; S.flash = v; const t = S.turnos.find((x) => x.id === v);
    if (t.fecha === HOY) { go("agenda"); setTimeout(() => document.getElementById("row-" + v)?.scrollIntoView({ block: "center", behavior: "smooth" }), 60); }
    else { const w = Math.floor(diffDays(semanaDias(0)[0], t.fecha) / 7); S.cal = { semana: w, sede: "", prof: "", canc: false }; go("calendario"); } },
  hce(v) { S.modal = null; go("paciente/" + v); },
  nuevoTurno(v) { const [fecha, p] = (v || HOY).split("|"); S.modal = { t: "nuevo", fecha: fecha < HOY ? HOY : fecha, prac: "pr1", sede: "centro", pac: p || S.pacientes[0].id }; renderModal(); },
  nDia(v) { S.modal.fecha = v; renderModal(); },
  guardarTurno() {
    const m = S.modal; const h = document.querySelector('input[name="nhora"]:checked'); if (!h) return;
    let pid = m.pac;
    if (pid === "__nuevo") {
      const nombre = val("n-nom"), apellido = val("n-ape"), dni = val("n-dni").replace(/\D/g, "");
      if (!nombre || !apellido || dni.length < 6) return toast("Completá nombre, apellido y DNI.");
      pid = crearPaciente({ nombre, apellido, dni, tel: "", cob: "Particular", email: "" });
    }
    const prac = pracById[m.prac]; const dur = horariosDe(prac.prof, m.sede, m.fecha)[0]?.dur || 20;
    const t = { id: "t" + S.nextId++, fecha: m.fecha, min: +h.value, dur, pac: pid, prof: prac.prof, sede: m.sede, prac: prac.id, cob: pac(pid).cob, estado: "RESERVADO", canal: prac.video ? "VIDEO" : "PRESENCIAL", conf: false, llamado: null };
    S.turnos.push(t); S.modal = null; toast(`Turno creado: ${fCorta(t.fecha)} ${hhmm(t.min)} · ${pacNom(pac(pid))}`); A.verEnAgenda(t.id);
  },
  nuevoPaciente() { S.modal = { t: "pac", id: null }; renderModal(); },
  editarPac(v) { S.modal = { t: "pac", id: v }; renderModal(); },
  guardarPac(v) {
    const d = { nombre: val("p-nom"), apellido: val("p-ape"), dni: val("p-dni").replace(/\D/g, ""), tel: val("p-tel"), cob: val("p-cob"), email: val("p-mail") };
    if (!d.nombre || !d.apellido || d.dni.length < 6) return toast("Completá nombre, apellido y DNI.");
    if (v) { Object.assign(pac(v), d); S.modal = null; toast("Paciente actualizado (solo en esta demo)."); render(); }
    else { const id = crearPaciente(d); S.modal = null; toast("Paciente creado (solo en esta demo)."); go("paciente/" + id); }
  },
  adjuntar() { const e = pick(D.estudios); S._adj = e[0]; $("#hce-adj").textContent = "📎 " + e[0] + " (ejemplo)"; toast("Demo: se adjunta un archivo de ejemplo, no se sube nada."); },
  archivo() { toast("En la demo los archivos son de ejemplo y no se abren."); },
  agregarHCE(v) {
    const texto = val("hce-txt"); if (!texto) { $("#hce-txt").focus(); return toast("Escribí la evolución primero."); }
    const r = { id: "h" + S.nextId++, pac: v, prof: val("hce-prof"), fecha: HOY, texto, priv: val("hce-vis") === "1", adj: S._adj || null };
    S._adj = null; S.hce.push(r); S.flash = r.id; toast("Registro agregado a la historia clínica."); render();
    setTimeout(() => document.getElementById("hce")?.scrollIntoView({ behavior: "smooth" }), 50);
  },
  agregarReceta(v) { const texto = val("rec-txt"); if (!texto) return toast("Escribí la receta primero."); const r = { id: "r" + S.nextId++, pac: v, prof: "p1", fecha: HOY, texto }; S.recetas.push(r); S.flash = r.id; toast("Receta agregada."); render(); },
  subirEstudio(v) { const e = pick(D.estudios); S.estudios.unshift({ id: "e" + S.nextId++, pac: v, nombre: e[0], tipo: e[1], fecha: HOY }); toast("Demo: se agregó un estudio de ejemplo."); render(); },
  borrarEstudio(v) { S.estudios = S.estudios.filter((e) => e.id !== v); toast("Estudio eliminado."); render(); },
  calSem(v) { S.cal.semana = v === "0" ? 0 : S.cal.semana + Number(v); render(); },
  aplicar(k) { S[k] = { desde: val(k + "-desde") || S[k].desde, hasta: val(k + "-hasta") || S[k].hasta, sede: val(k + "-sede"), prof: val(k + "-prof") }; if (S[k].desde > S[k].hasta) [S[k].desde, S[k].hasta] = [S[k].hasta, S[k].desde]; render(); },
  rango(v) { const [k, r] = v.split("|"); Object.assign(S[k], r === "mes" ? rangoMes() : defaultsRango()); render(); },
  exportar() {
    const f = S.rep; const ts = S.turnos.filter((t) => t.fecha >= f.desde && t.fecha <= f.hasta && (!f.sede || t.sede === f.sede) && (!f.prof || t.prof === f.prof)).sort(ordenar);
    const rows = [["Fecha","Hora","Paciente","DNI","Cobertura","Práctica","Profesional","Sede","Estado","Precio"], ...ts.map((t) => { const p = pac(t.pac); return [fCorta(t.fecha), hhmm(t.min), pacNom(p), p.dni, t.cob, pracLabel(t.prac), profLabel(t.prof), sedeById[t.sede].nombre, LABEL[t.estado], pracById[t.prac].precio]; })];
    const csv = "﻿" + rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `turnos_demo_${f.desde}_${f.hasta}.csv`; a.click();
    toast(`CSV con ${ts.length} turnos (datos ficticios).`);
  },
  kKey(d) { if (S.kio.dni.length < 9) S.kio.dni += d; render(); },
  kBack() { S.kio.dni = S.kio.dni.slice(0, -1); render(); },
  kFill(v) { S.kio.dni = v; render(); },
  kOk() { if (S.kio.dni.length >= 6) { checkIn(); render(); } },
  kReset() { clearTimeout(S.kio.timer); S.kio.res = null; S.kio.dni = ""; render(); },
  llamar() { llamarSiguiente(); render(); },
  recVer() { S.rec.fecha = val("rec-fecha") || S.rec.fecha; render(); },
  wa(v) { S.modal = { t: "wa", id: v, link: false }; renderModal(); },
  waLink() { S.modal.link = true; renderModal(); },
  pConf(v) { const t = S.turnos.find((x) => x.id === v); t.conf = true; S.flash = v; toast("El paciente confirmó: ya figura ✓ Confirmado en la agenda."); render(); },
  pCanc(v) { const t = S.turnos.find((x) => x.id === v); t.estado = "CANCELADO"; toast("El paciente canceló: el horario queda libre para otro turno."); render(); },
  resvDia(v) { S.resv.fecha = v; render(); },
  resvOtra() { S.resv = { prac: "", sede: "", fecha: "", paso: 1, hecho: null }; render(); },
  reservar() {
    const r = S.resv; const h = document.querySelector('input[name="hora"]:checked'); if (!h) return;
    const d = { nombre: val("rv-nombre"), apellido: val("rv-apellido"), dni: val("rv-dni").replace(/\D/g, ""), tel: val("rv-tel"), cob: val("rv-cob"), email: "" };
    if (!d.nombre || !d.apellido || d.dni.length < 6 || !d.tel) return toast("Completá nombre, apellido, DNI y teléfono.");
    let p = S.pacientes.find((x) => x.dni === d.dni); const pid = p ? p.id : crearPaciente(d);
    const prac = pracById[r.prac]; const dur = horariosDe(prac.prof, r.sede, r.fecha)[0]?.dur || 20;
    const t = { id: "t" + S.nextId++, fecha: r.fecha, min: +h.value, dur, pac: pid, prof: prac.prof, sede: r.sede, prac: prac.id, cob: d.cob, estado: "RESERVADO", canal: prac.video ? "VIDEO" : "PRESENCIAL", conf: true, llamado: null };
    S.turnos.push(t); r.hecho = t.id; render(); window.scrollTo(0, 0);
  },
};
function crearPaciente(d) {
  const id = "pa" + S.nextId++;
  S.pacientes.push({ id, nombre: d.nombre, apellido: d.apellido, dni: d.dni, tel: d.tel || "—", email: d.email || "—", cob: d.cob || "Particular", afiliado: "", nac: "1990-01-01", sexo: "—", creado: HOY });
  return id;
}
const C = {
  calSede(v) { S.cal.sede = v; render(); }, calProf(v) { S.cal.prof = v; render(); }, calCanc(v, el) { S.cal.canc = el.checked; render(); },
  nPac(v) { S.modal.pac = v; renderModal(); }, nPrac(v) { S.modal.prac = v; renderModal(); }, nSede(v) { S.modal.sede = v; renderModal(); }, nFecha(v) { if (v) { S.modal.fecha = v < HOY ? HOY : v; renderModal(); } },
  resvPrac(v) { S.resv.prac = v; const ss = sedesDeProf(pracById[v].prof); if (!ss.includes(S.resv.sede)) S.resv.sede = ss[0]; if (!S.resv.fecha) S.resv.fecha = proximosDias(pracById[v].prof, S.resv.sede)[0] || HOY; render(); },
  resvSede(v) { S.resv.sede = v; render(); }, resvFecha(v) { if (v) { S.resv.fecha = v < HOY ? HOY : v; render(); } },
};

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a;
  if (a === "cerrarOv") { if (e.target === el) A.cerrar(); return; }
  if (el.tagName === "A" && !el.getAttribute("href")) e.preventDefault();
  if (A[a]) { e.preventDefault(); A[a](el.dataset.v, e); }
});
document.addEventListener("change", (e) => { const el = e.target.closest("[data-c]"); if (el && C[el.dataset.c]) C[el.dataset.c](el.value, el); });
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; $("#lista-pac").innerHTML = listaPac(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && S.modal) A.cerrar();
  if (ruta().r === "kiosco-pantalla" && !S.kio.res) {
    if (/^\d$/.test(e.key)) A.kKey(e.key); else if (e.key === "Backspace") A.kBack(); else if (e.key === "Enter") A.kOk();
  }
});

render();
if (!location.hash) S.modal = { t: "tour" }, renderModal();
</script>
</body>
</html>
